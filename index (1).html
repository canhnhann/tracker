function daysLeft(dateStr) {
  if (!dateStr) return null;
  const diff = new Date(dateStr) - new Date();
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}
function uid() { return Math.random().toString(36).slice(2, 9); }
function toDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function today() { return toDateKey(new Date()); }

}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }

/* ─── Firebase Sync Hook ─── */
function useFirebaseSync() {
  const [syncing, setSyncing] = useState(false);
  const [syncOk, setSyncOk] = useState(false);
  const [fbReady, setFbReady] = useState(() => !!window._fbReady);
  useEffect(() => {
    if (window._fbReady) return;
    const handler = () => setFbReady(true);
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, []);
  const pushToFirebase = useCallback(async (key, value) => {
    if (!fbReady || !window._setDoc || !window._fbDoc) return;
    try {
      setSyncing(true);
      await window._setDoc(window._fbDoc("studytodo"), { [key]: JSON.stringify(value) }, { merge: true });
      setSyncOk(true);
    } catch(e) { console.error("Firebase write error", e); }
    finally { setSyncing(false); }
  }, [fbReady]);
  return { fbReady, syncing, syncOk, pushToFirebase };
}

/* ─── Responsive ─── */
function useIsMobile() {
  const [mobile, setMobile] = useState(() => window.innerWidth < 500);
  useEffect(() => {
    const fn = () => setMobile(window.innerWidth < 500);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return mobile;
}

/* ─── CountdownBadge ─── */
function CountdownBadge({ date, accent, large }) {
  const days = daysLeft(date);
  if (days === null) return null;
  let color, bg;
  if (days < 0)       { color="#9ca3af"; bg="#f3f4f6"; }
  else if (days <= 3) { color="#dc2626"; bg="#fef2f2"; }
  else if (days <= 7) { color="#d97706"; bg="#fffbeb"; }
  else                { color=accent||"#5c6bc0"; bg=(accent||"#5c6bc0")+"18"; }
  const label = days < 0 ? "Đã qua" : days === 0 ? "Hôm nay!" : `${days} ngày`;
  return (
    <span style={{fontSize:large?12:11,fontWeight:700,letterSpacing:".04em",color,background:bg,border:`1px solid ${color}25`,borderRadius:20,padding:large?"3px 10px":"2px 8px",whiteSpace:"nowrap",display:"inline-flex",alignItems:"center",gap:3,flexShrink:0}}>
      {IC.clock} {label}
    </span>
  );
}

/* ─── EditableText ─── */
function EditableText({ value, onSave, style, placeholder, isMobile }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const ref = useRef();
  useEffect(() => { if (editing) ref.current?.focus(); }, [editing]);
  const commit = () => { setEditing(false); if (val.trim()) onSave(val.trim()); else setVal(value); };
  if (editing) return (
    <input ref={ref} value={val} onChange={e => setVal(e.target.value)} onBlur={commit}
      onKeyDown={e => { if (e.key==="Enter") commit(); if (e.key==="Escape") { setVal(value); setEditing(false); } }}
      style={{...style,background:"transparent",border:"none",borderBottom:"1.5px solid #a5b4fc",outline:"none",padding:0,width:"100%",color:"inherit",fontSize:isMobile?16:(style.fontSize||14)}} />
  );
  return (
    <span style={{...style,cursor:"text",display:"inline-flex",alignItems:"center",gap:4}} onClick={() => setEditing(true)}>
      {value || <span style={{color:"#d1d5db"}}>{placeholder}</span>}
      <span style={{opacity:0.2,flexShrink:0}}>{IC.edit}</span>
    </span>
  );
}

/* ─── MaterialsSection ─── */
function MaterialsSection({ materials, onChange, isMobile }) {
  const fileInputRef = useRef();
  const handleUpload = (e) => {
    Array.from(e.target.files).forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => onChange([...materials, { id:uid(), name:f.name, type:f.type, dataUrl:ev.target.result }]);
      reader.readAsDataURL(f);
    });
    e.target.value = "";
  };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {materials.map(m => (
        <FileItem key={m.id} file={m} isMobile={isMobile}
          onDelete={() => onChange(materials.filter(x=>x.id!==m.id))}
          onRename={n => onChange(materials.map(x=>x.id===m.id?{...x,name:n}:x))} />
      ))}
      <button onClick={() => fileInputRef.current?.click()} style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6,padding:isMobile?"12px 14px":"7px 10px",background:"none",border:"1px dashed #d1d5db",borderRadius:8,color:"#9ca3af",fontSize:isMobile?14:12.5,cursor:"pointer",minHeight:isMobile?48:"auto"}}>
        {IC.upload} Tải tài liệu / ảnh lên
      </button>
      <input ref={fileInputRef} type="file" multiple style={{display:"none"}} onChange={handleUpload} />
    </div>
  );
}

/* ─── MiniProgressChart ─── */
function MiniProgressChart({ subjects, accent }) {
  if (!subjects.length) return null;
  return (
    <div style={{display:"flex",gap:3,alignItems:"flex-end",height:36}}>
      {subjects.map(s => {
        const total = s.lessons?.length||0, done = s.lessons?.filter(l=>l.done).length||0, pct = total?done/total:0;
        return (
          <div key={s.id} title={`${s.name}: ${done}/${total}`} style={{display:"flex",flexDirection:"column",alignItems:"center",flex:1,maxWidth:30,gap:2}}>
            <div style={{width:"100%",height:32,background:"#f3f4f6",borderRadius:4,display:"flex",flexDirection:"column",justifyContent:"flex-end",overflow:"hidden"}}>
              <div style={{width:"100%",height:`${Math.max(pct*100,pct>0?8:0)}%`,background:accent,borderRadius:4,transition:"height .4s ease"}} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

/* ─── Dashboard ─── */
function Dashboard({ subjects, theme, isMobile }) {
  const { accent, accentLight, accentText } = theme;
  const totalSubjects = subjects.length;
  const totalLessons = subjects.reduce((a,s)=>a+(s.lessons?.length||0),0);
  const doneLessons = subjects.reduce((a,s)=>a+(s.lessons?.filter(l=>l.done).length||0),0);
  const pct = totalLessons?Math.round((doneLessons/totalLessons)*100):0;
  const upcoming = [];
  subjects.forEach(s=>(s.lessons||[]).forEach(l=>{ if(!l.done&&l.deadline){const d=daysLeft(l.deadline);if(d!==null&&d>=0&&d<=7)upcoming.push({subjectName:s.name,lessonTitle:l.title,days:d});}}));
  upcoming.sort((a,b)=>a.days-b.days);
  const nextExam = [...subjects].filter(s=>s.examDate&&daysLeft(s.examDate)!==null&&daysLeft(s.examDate)>=0).sort((a,b)=>new Date(a.examDate)-new Date(b.examDate))[0];
  const statItems = [{label:"Môn học",value:totalSubjects},{label:"Bài học",value:totalLessons},{label:"Hoàn thành",value:doneLessons},{label:"Tiến độ",value:`${pct}%`}];
  return (
    <div style={{background:`linear-gradient(135deg,${accentLight} 0%,#fff 65%)`,border:`1px solid ${accent}22`,borderRadius:isMobile?14:16,padding:isMobile?"16px 16px":"20px 24px",marginBottom:isMobile?16:20}}>
      <div style={{display:"flex",alignItems:"center",gap:6,marginBottom:isMobile?14:16}}><span style={{color:accent}}>{IC.chart}</span><span style={{fontSize:11,fontWeight:700,letterSpacing:".1em",textTransform:"uppercase",color:accentText}}>Tổng quan</span></div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:isMobile?8:10,marginBottom:isMobile?14:16}}>
        {statItems.map(({label,value})=>(
          <div key={label} style={{background:"#fff",borderRadius:10,padding:isMobile?"10px 6px":"11px 12px",border:`1px solid ${accent}18`,textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,.04)"}}>
            <div style={{fontSize:isMobile?20:22,fontWeight:800,color:accentText,letterSpacing:"-.03em",lineHeight:1.1}}>{value}</div>
            <div style={{fontSize:isMobile?10:11,color:"#9ca3af",marginTop:2,fontWeight:600}}>{label}</div>
          </div>
        ))}
      </div>
      <div style={{marginBottom:isMobile?14:16}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}><span style={{fontSize:11.5,color:"#6b7280",fontWeight:500}}>Tiến độ học tập</span><span style={{fontSize:11.5,color:accentText,fontWeight:700}}>{pct}%</span></div>
        <div style={{height:isMobile?7:6,background:"#e5e7eb",borderRadius:4,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:`linear-gradient(90deg,${accent},${accent}bb)`,borderRadius:4,transition:"width .6s ease"}} /></div>
      </div>
      <div style={{display:"flex",gap:isMobile?12:16,flexWrap:isMobile?"wrap":"nowrap",alignItems:"flex-start"}}>
        {subjects.length>1&&<div style={{flex:isMobile?"0 0 auto":1,minWidth:0}}><div style={{fontSize:10,color:"#9ca3af",marginBottom:5,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase"}}>Theo môn</div><MiniProgressChart subjects={subjects} accent={accent} /></div>}
        {upcoming.length>0&&<div style={{flex:isMobile?"1 0 60%":1.6,minWidth:0}}><div style={{fontSize:10,color:"#dc2626",marginBottom:6,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase"}}>⚠ Deadline gần</div>{upcoming.slice(0,isMobile?2:3).map((u,i)=><div key={i} style={{fontSize:isMobile?12.5:12,color:"#374151",marginBottom:4,display:"flex",justifyContent:"space-between",gap:6}}><span style={{overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}><span style={{color:"#9ca3af"}}>{u.subjectName} · </span>{u.lessonTitle}</span><span style={{color:u.days===0?"#dc2626":u.days<=2?"#d97706":"#6b7280",fontWeight:700,flexShrink:0}}>{u.days===0?"Hôm nay":`${u.days}d`}</span></div>)}</div>}
        {nextExam&&<div style={{flex:isMobile?"1 0 35%":1,minWidth:0}}><div style={{fontSize:10,color:"#9ca3af",marginBottom:5,fontWeight:700,letterSpacing:".06em",textTransform:"uppercase"}}>Thi gần nhất</div><div style={{fontSize:isMobile?13:12.5,fontWeight:700,color:accentText,marginBottom:4,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{nextExam.name}</div><CountdownBadge date={nextExam.examDate} accent={accent} large /></div>}
      </div>
    </div>
  );
}

/* ─── SubjectCard ─── */
function SubjectCard({ subject, onUpdate, onDelete, theme, isMobile }) {
  const [open, setOpen] = useState(true);
  const [addingLesson, setAddingLesson] = useState(false);
  const [newLesson, setNewLesson] = useState("");
  const update = (patch) => onUpdate({...subject,...patch});
  const addLesson = () => {
    if (!newLesson.trim()) return;
    update({lessons:[...(subject.lessons||[]),{id:uid(),title:newLesson.trim(),done:false,summary:"",materials:[],deadline:""}]});
    setNewLesson(""); setAddingLesson(false);
  };
  const updateLesson = (id,data) => update({lessons:subject.lessons.map(l=>l.id===id?data:l)});
  const deleteLesson = (id) => update({lessons:subject.lessons.filter(l=>l.id!==id)});
  const total=subject.lessons?.length||0, done=subject.lessons?.filter(l=>l.done).length||0, pct=total?Math.round((done/total)*100):0;
  return (
    <div style={{background:"#fff",border:"1px solid #e5e7eb",borderRadius:isMobile?14:12,overflow:"hidden",marginBottom:isMobile?12:10,boxShadow:"0 1px 6px rgba(0,0,0,.05)"}}>
      <div style={{height:3,background:`linear-gradient(90deg,${theme.accent},${theme.accent}55)`}} />
      <div style={{padding:isMobile?"14px 16px":"13px 16px",display:"flex",alignItems:"center",gap:isMobile?10:8}}>
        <button onClick={() => setOpen(v=>!v)} style={{background:"none",border:"none",cursor:"pointer",color:"#d1d5db",display:"flex",padding:isMobile?6:2,minWidth:isMobile?40:28,minHeight:isMobile?44:"auto",alignItems:"center",justifyContent:"center",flexShrink:0}}>{IC.chevron(open)}</button>
        <span style={{color:theme.accent,flexShrink:0}}>{IC.book}</span>
        <div style={{flex:1,minWidth:0}}>
          <EditableText value={subject.name} onSave={n=>update({name:n})} isMobile={isMobile} style={{fontSize:isMobile?17:15,fontWeight:700,color:"#111827",letterSpacing:"-.01em"}} placeholder="Tên môn học" />
        </div>
        {!isMobile&&<CountdownBadge date={subject.examDate} accent={theme.accent} />}
        <button onClick={onDelete} style={{color:"#e5e7eb",background:"none",border:"none",cursor:"pointer",display:"flex",padding:isMobile?6:4,minWidth:isMobile?40:28,minHeight:isMobile?44:"auto",alignItems:"center",justifyContent:"center",flexShrink:0}}>{IC.trash}</button>
      </div>
      <div style={{padding:isMobile?"0 16px 14px":"0 16px 12px",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
        <span style={{fontSize:11,color:"#9ca3af",letterSpacing:".04em",textTransform:"uppercase",flexShrink:0}}>Ngày thi</span>
        <input type="date" value={subject.examDate||""} onChange={e=>update({examDate:e.target.value})} style={{background:"none",border:"none",borderBottom:"1px solid #e5e7eb",color:"#6b7280",fontSize:isMobile?15:12,outline:"none",cursor:"pointer",minHeight:isMobile?40:"auto"}} />
        {isMobile&&subject.examDate&&<CountdownBadge date={subject.examDate} accent={theme.accent} large />}
        {total>0&&<div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8}}><span style={{fontSize:12,color:"#9ca3af",fontWeight:600}}>{done}/{total}</span><div style={{width:isMobile?64:56,height:isMobile?5:4,background:"#f3f4f6",borderRadius:3,overflow:"hidden"}}><div style={{width:`${pct}%`,height:"100%",background:theme.accent,borderRadius:3,transition:"width .3s"}} /></div><span style={{fontSize:12,color:theme.accent,fontWeight:700}}>{pct}%</span></div>}
      </div>
      {open&&(
        <div style={{padding:isMobile?"0 14px 16px":"0 16px 14px"}}>
          <div style={{height:1,background:"#f3f4f6",marginBottom:10}} />
          {(subject.lessons||[]).map(l=><LessonItem key={l.id} lesson={l} accent={theme.accent} isMobile={isMobile} onUpdate={data=>updateLesson(l.id,data)} onDelete={()=>deleteLesson(l.id)} />)}
          {addingLesson?(
            <div style={{display:"flex",gap:6,marginTop:8}}>
              <input autoFocus value={newLesson} onChange={e=>setNewLesson(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addLesson();if(e.key==="Escape"){setAddingLesson(false);setNewLesson("");}}} placeholder="Tên bài học..." style={{flex:1,background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8,color:"#1f2937",fontSize:isMobile?16:13,padding:isMobile?"10px 14px":"7px 10px",outline:"none"}} />
              <button onClick={addLesson} style={{background:theme.accent,border:"none",borderRadius:8,color:"#fff",fontSize:isMobile?15:12,padding:isMobile?"10px 18px":"7px 14px",cursor:"pointer",fontWeight:700,flexShrink:0}}>Thêm</button>
              <button onClick={()=>{setAddingLesson(false);setNewLesson("");}} style={{background:"none",border:"none",color:"#9ca3af",fontSize:isMobile?15:12,cursor:"pointer",flexShrink:0}}>Hủy</button>
            </div>
          ):(
            <button onClick={()=>setAddingLesson(true)} style={{display:"flex",alignItems:"center",gap:6,marginTop:8,background:"none",border:"none",color:"#d1d5db",fontSize:isMobile?14:12,cursor:"pointer",padding:isMobile?"8px 0":"4px 0",minHeight:isMobile?44:"auto"}}>
              {IC.plus} Thêm bài
            </button>
          )}
        </div>
      )}
    </div>
  );
}

/* ─── DayScheduleSheet ─── */
function DayScheduleSheet({ dateKey, onClose, theme, isMobile, schedule, onScheduleChange }) {
  const d = new Date(dateKey + "T00:00:00");
  const dayName = DAYS_VN_FULL[d.getDay()];
  const dateLabel = `${d.getDate()} tháng ${d.getMonth()+1}, ${d.getFullYear()}`;
  const dayData = schedule[dateKey] || {};
  const isToday = dateKey === today();

  const updateSlot = (slotId, text) => {
    const updated = { ...dayData, [slotId]: text };
    onScheduleChange({ ...schedule, [dateKey]: updated });
  };

  return (
    <div style={{position:"fixed",inset:0,zIndex:300,display:"flex",flexDirection:"column",background:"rgba(0,0,0,0.45)",animation:"fadeIn .15s ease"}}>
      <div onClick={onClose} style={{flex:1}} />
      <div style={{background:"#fff",borderRadius:"20px 20px 0 0",maxHeight:"88vh",display:"flex",flexDirection:"column",animation:"slideUp .25s ease"}}>
        {/* Handle */}
        <div style={{display:"flex",justifyContent:"center",padding:"10px 0 0"}}>
          <div style={{width:36,height:4,borderRadius:2,background:"#e5e7eb"}} />
        </div>
        {/* Header */}
        <div style={{padding:isMobile?"14px 20px 12px":"16px 28px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #f3f4f6",flexShrink:0}}>
          <div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              <span style={{fontSize:isMobile?22:20,fontWeight:800,color:"#111827"}}>{d.getDate()}</span>
              {isToday && <span style={{fontSize:11,fontWeight:700,background:theme.accent,color:"#fff",borderRadius:20,padding:"2px 8px",letterSpacing:".04em"}}>Hôm nay</span>}
            </div>
            <div style={{fontSize:13,color:"#9ca3af",fontWeight:500,marginTop:2}}>{dayName}, {dateLabel}</div>
          </div>
          <button onClick={onClose} style={{background:"#f3f4f6",border:"none",borderRadius:10,padding:"8px 10px",cursor:"pointer",color:"#6b7280",display:"flex",alignItems:"center",justifyContent:"center"}}>{IC.x}</button>
        </div>
        {/* Slots */}
        <div style={{overflowY:"auto",padding:isMobile?"14px 16px 32px":"16px 24px 32px",display:"flex",flexDirection:"column",gap:12}}>
          {TIME_SLOTS.map(slot => {
            const colors = PERIOD_COLORS[slot.period];
            const val = dayData[slot.id] || "";
            const hasContent = val.trim().length > 0;
            return (
              <div key={slot.id} style={{
                background: hasContent ? colors.bg : "#fafafa",
                border: `1px solid ${hasContent ? colors.border : "#e5e7eb"}`,
                borderRadius:12, overflow:"hidden",
                opacity: hasContent ? 1 : 0.45,
                transition:"opacity .2s, border .2s, background .2s",
                boxShadow: hasContent ? "0 2px 8px rgba(0,0,0,0.07)" : "none",
              }}>
                <div style={{display:"flex",alignItems:"center",gap:8,padding:isMobile?"10px 14px 8px":"8px 14px 6px"}}>
                  <span style={{width:8,height:8,borderRadius:"50%",background:hasContent?colors.dot:"#d1d5db",flexShrink:0}} />
                  <span style={{fontSize:12,fontWeight:hasContent?700:500,color:hasContent?colors.label:"#9ca3af",letterSpacing:".03em"}}>{slot.label}</span>
                  <span style={{fontSize:11,color:hasContent?colors.label:"#9ca3af",opacity:0.7,marginLeft:"auto"}}>{slot.time}</span>
                </div>
                <textarea
                  value={val}
                  onChange={e => updateSlot(slot.id, e.target.value)}
                  placeholder={`Thêm lịch ${slot.label.toLowerCase()}...`}
                  style={{width:"100%",background:"transparent",border:"none",outline:"none",resize:"none",fontSize:isMobile?15:13,color:"#374151",lineHeight:1.7,padding:isMobile?"0 14px 12px":"0 14px 10px",fontFamily:"inherit",minHeight:isMobile?64:54,boxSizing:"border-box",opacity:hasContent?1:0.6}}
                />
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ─── CalendarPage ─── */
function CalendarPage({ theme, isMobile, schedule, onScheduleChange }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [selectedDay, setSelectedDay] = useState(null);
  const { accent, accentLight, accentText } = theme;
  const todayKey = today();

  const prevMonth = () => { if (month === 0) { setMonth(11); setYear(y=>y-1); } else setMonth(m=>m-1); };
  const nextMonth = () => { if (month === 11) { setMonth(0); setYear(y=>y+1); } else setMonth(m=>m+1); };

  // Build calendar grid (Mon-start)
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month+1, 0);
  // Monday-based: Mon=0 ... Sun=6
  let startDow = firstDay.getDay() - 1; if (startDow < 0) startDow = 6;
  const totalCells = startDow + lastDay.getDate();
  const weeks = Math.ceil(totalCells / 7);
  const cells = [];
  for (let i = 0; i < weeks * 7; i++) {
    const dayNum = i - startDow + 1;
    if (dayNum < 1 || dayNum > lastDay.getDate()) { cells.push(null); continue; }
    const d = new Date(year, month, dayNum);
    const key = toDateKey(d);
    const isPast = false;
    const isToday = key === todayKey;
    const hasData = schedule[key] && Object.values(schedule[key]).some(v => v && v.trim());
    cells.push({ dayNum, key, isPast, isToday, hasData, dow: d.getDay() });
  }

  const DAY_HEADERS = ["T2","T3","T4","T5","T6","T7","CN"];

  return (
    <div style={{maxWidth:isMobile?"100%":720,margin:"0 auto",padding:isMobile?"16px 12px 80px":"24px 28px 80px"}}>
      {/* Month nav */}
      <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:isMobile?16:20}}>
        <button onClick={prevMonth} style={{background:"none",border:"1px solid #e5e7eb",borderRadius:9,padding:isMobile?"10px 12px":"7px 10px",cursor:"pointer",color:"#6b7280",display:"flex",alignItems:"center",minHeight:isMobile?44:"auto"}}>{IC.arrowLeft}</button>
        <div style={{textAlign:"center"}}>
          <div style={{fontSize:isMobile?19:17,fontWeight:800,color:"#111827",letterSpacing:"-.02em"}}>{MONTHS_VN[month]} {year}</div>
        </div>
        <button onClick={nextMonth} style={{background:"none",border:"1px solid #e5e7eb",borderRadius:9,padding:isMobile?"10px 12px":"7px 10px",cursor:"pointer",color:"#6b7280",display:"flex",alignItems:"center",minHeight:isMobile?44:"auto"}}>{IC.arrowRight}</button>
      </div>

      {/* Calendar grid */}
      <div style={{background:"#fff",borderRadius:isMobile?16:14,border:"1px solid #e5e7eb",overflow:"hidden",boxShadow:"0 1px 8px rgba(0,0,0,.05)"}}>
        {/* Day headers */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:`2px solid ${accent}`,background:accentLight}}>
          {DAY_HEADERS.map((h,i) => (
            <div key={h} style={{textAlign:"center",padding:isMobile?"8px 2px":"9px 2px",fontSize:isMobile?11:11,fontWeight:700,letterSpacing:".06em",color:i===6?"#dc2626":accentText}}>
              {h}
            </div>
          ))}
        </div>
        {/* Weeks */}
        {Array.from({length:weeks}).map((_,wi) => (
          <div key={wi} style={{display:"grid",gridTemplateColumns:"repeat(7,1fr)",borderBottom:wi<weeks-1?"1px solid #f3f4f6":"none"}}>
            {cells.slice(wi*7, wi*7+7).map((cell, ci) => {
              if (!cell) return <div key={ci} style={{minHeight:isMobile?52:56}} />;
              const isSun = cell.dow === 0;
              const isTodayCell = cell.isToday;
              const canClick = !cell.isPast || cell.isToday;
              return (
                <button key={ci} onClick={() => canClick && setSelectedDay(cell.key)}
                  style={{
                    minHeight:isMobile?52:56, border:"none", background:"transparent",
                    cursor:"pointer",
                    display:"flex", flexDirection:"column", alignItems:"center", justifyContent:"center",
                    gap:4, padding:4, borderLeft:ci>0?"1px solid #f9fafb":"none",
                    transition:"background .1s",
                    ...(canClick && !isTodayCell ? {":hover":{background:accentLight}} : {}),
                  }}
                  onMouseEnter={e => { if(canClick && !isTodayCell) e.currentTarget.style.background=accentLight; }}
                  onMouseLeave={e => { if(canClick && !isTodayCell) e.currentTarget.style.background="transparent"; }}
                >
                  <div style={{
                    width:isMobile?32:30, height:isMobile?32:30, borderRadius:"50%",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    background:isTodayCell?accent:"transparent",
                    fontSize:isMobile?15:14, fontWeight:isTodayCell?800:600,
                    color:isTodayCell?"#fff":isSun?"#dc2626":"#111827",
                  }}>
                    {cell.dayNum}
                  </div>
                  {cell.hasData && (
                    <div style={{display:"flex",gap:2}}>
                      <span style={{width:5,height:5,borderRadius:"50%",background:accent}} />
                    </div>
                  )}
                </button>
              );
            })}
          </div>
        ))}
      </div>

      {/* Legend */}
      <div style={{marginTop:16,display:"flex",gap:16,flexWrap:"wrap",justifyContent:"center"}}>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"#9ca3af"}}>
          <span style={{width:16,height:16,borderRadius:"50%",background:accent,display:"inline-block"}} />
          Hôm nay
        </div>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"#9ca3af"}}>
          <span style={{width:8,height:8,borderRadius:"50%",background:accent,display:"inline-block"}} />
          Có lịch
        </div>
        <div style={{display:"flex",alignItems:"center",gap:5,fontSize:11,color:"#d1d5db"}}>
          <span style={{fontSize:13,fontWeight:600}}>15</span>
          Ngày đã qua
        </div>
      </div>

      {selectedDay && (
        <DayScheduleSheet
          dateKey={selectedDay}
          onClose={() => setSelectedDay(null)}
          theme={theme}
          isMobile={isMobile}
          schedule={schedule}
          onScheduleChange={onScheduleChange}
        />
      )}
    </div>
  );
}

/* ─── App ─── */
function App() {
  const isMobile = useIsMobile();
  const [data, setData] = useState(() => loadData());
  const [schedule, setSchedule] = useState(() => loadSchedule());
  const [addingSubject, setAddingSubject] = useState(false);
  const [newSubjectName, setNewSubjectName] = useState("");
  const [themeKey, setThemeKey] = useState(() => localStorage.getItem("studytodo_theme")||"indigo");
  const [showDashboard, setShowDashboard] = useState(true);
  const [activeTab, setActiveTab] = useState("monhoc");
  const [syncId, setSyncId] = useState(() => localStorage.getItem("studytodo_uid") || "");
  const [showSyncId, setShowSyncId] = useState(false);
  const [importId, setImportId] = useState("");
  const [showImportBox, setShowImportBox] = useState(false);
  const theme = THEMES[themeKey]||THEMES.indigo;
  const { fbReady, syncing, syncOk, pushToFirebase } = useFirebaseSync();

  // Lắng nghe realtime từ Firebase
  useEffect(() => {
    if (!fbReady || !window._onSnapshot || !window._fbDoc) return;
    const unsub = window._onSnapshot(window._fbDoc("studytodo"), (snap) => {
      if (!snap.exists()) return;
      const d = snap.data();
      if (d.monhoc) { const v = JSON.parse(d.monhoc); setData(v); saveData(v); }
      if (d.lichhoc) { const v = JSON.parse(d.lichhoc); setSchedule(v); saveSchedule(v); }
    });
    return () => unsub();
  }, [fbReady]);

  // Ghi lên Firebase + localStorage khi data thay đổi
  useEffect(() => { saveData(data); pushToFirebase("monhoc", data); }, [data]);
  useEffect(() => { saveSchedule(schedule); pushToFirebase("lichhoc", schedule); }, [schedule]);
  useEffect(() => { localStorage.setItem("studytodo_theme",themeKey); }, [themeKey]);

  // Đổi sang thiết bị khác bằng mã ID
  const switchToId = () => {
    const id = importId.trim();
    if (!id) return;
    localStorage.setItem("studytodo_uid", id);
    window.location.reload();
  };

  const updateSubject = (id,u) => setData(d=>({...d,subjects:d.subjects.map(s=>s.id===id?u:s)}));
  const deleteSubject = (id) => setData(d=>({...d,subjects:d.subjects.filter(s=>s.id!==id)}));
  const addSubject = () => {
    if(!newSubjectName.trim())return;
    setData(d=>({...d,subjects:[...d.subjects,{id:uid(),name:newSubjectName.trim(),examDate:"",lessons:[]}]}));
    setNewSubjectName(""); setAddingSubject(false);
  };
  const sorted = [...data.subjects].sort((a,b)=>{
    if(!a.examDate&&!b.examDate)return 0;
    if(!a.examDate)return 1; if(!b.examDate)return -1;
    return new Date(a.examDate)-new Date(b.examDate);
  });
  const bottomPad = isMobile?"calc(24px + env(safe-area-inset-bottom))":"80px";
  const currentTabInfo = NAV_TABS.find(t=>t.id===activeTab);

  return (
    <div style={{minHeight:"100vh",background:"#f8fafc",fontFamily:"'Plus Jakarta Sans',sans-serif",color:"#111827"}}>
      {/* Header */}
      <div style={{background:"#fff",borderBottom:"1px solid #f3f4f6",paddingTop:isMobile?"env(safe-area-inset-top,0px)":0}}>
        <div style={{maxWidth:isMobile?"100%":720,margin:"0 auto",padding:isMobile?"14px 16px 10px":"16px 28px 12px",display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
          <div>
            <div style={{fontSize:10,letterSpacing:".18em",color:"#9ca3af",textTransform:"uppercase",fontWeight:700}}>Học tập</div>
            <h1 style={{margin:"2px 0 0",fontSize:isMobile?22:20,fontWeight:800,letterSpacing:"-.03em",color:"#111827",lineHeight:1.15}}>StudyTodo</h1>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:isMobile?10:8}}>
            {/* Sync status */}
            <button onClick={()=>setShowSyncId(v=>!v)} title="Đồng bộ thiết bị" style={{background:syncOk?"#f0fdf4":fbReady?"#fffbeb":"#f9fafb",border:`1px solid ${syncOk?"#bbf7d0":fbReady?"#fde68a":"#e5e7eb"}`,borderRadius:8,padding:isMobile?"7px 10px":"5px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontSize:isMobile?12:11,color:syncOk?"#15803d":fbReady?"#92400e":"#9ca3af",fontWeight:700}}>
              {syncing ? <span style={{display:"inline-block",width:10,height:10,border:"2px solid currentColor",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.7s linear infinite"}} /> : <span>{syncOk?"☁️✓":fbReady?"☁️":"○"}</span>}
              {!isMobile && (syncOk?"Đã lưu":fbReady?"Đang kết nối...":"Offline")}
            </button>
            <ThemePicker current={themeKey} onChange={setThemeKey} isMobile={isMobile} />
          </div>
        </div>
        {/* Sync ID panel */}
        {showSyncId && (
          <div style={{maxWidth:isMobile?"100%":720,margin:"0 auto",padding:isMobile?"0 16px 14px":"0 28px 14px",borderTop:"1px solid #f3f4f6"}}>
            <div style={{fontSize:11,color:"#9ca3af",fontWeight:600,marginBottom:6,marginTop:10}}>MÃ THIẾT BỊ CỦA BẠN</div>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
              <code style={{flex:1,background:"#f3f4f6",borderRadius:8,padding:"8px 12px",fontSize:13,color:"#374151",letterSpacing:".05em",wordBreak:"break-all"}}>{syncId}</code>
              <button onClick={()=>{navigator.clipboard.writeText(syncId);}} style={{background:theme.accent,border:"none",borderRadius:8,color:"#fff",fontSize:12,padding:"8px 14px",cursor:"pointer",fontWeight:700,flexShrink:0}}>Sao chép</button>
            </div>
            <div style={{fontSize:11,color:"#9ca3af",marginBottom:6,fontWeight:600}}>ĐỒNG BỘ THIẾT BỊ KHÁC — nhập mã từ thiết bị kia</div>
            <div style={{display:"flex",gap:8}}>

              <button onClick={switchToId} style={{background:theme.accent,border:"none",borderRadius:8,color:"#fff",fontSize:12,padding:"8px 14px",cursor:"pointer",fontWeight:700,flexShrink:0}}>Đồng bộ</button>
            </div>
            <p style={{fontSize:11,color:"#d1d5db",marginTop:8}}>💡 Sao chép mã thiết bị này → dán vào thiết bị khác để dùng chung dữ liệu</p>
          </div>
        )}
      </div>

      <NavBar activeTab={activeTab} onTabChange={setActiveTab} theme={theme} isMobile={isMobile} />

      {activeTab==="monhoc"?(
        <div style={{maxWidth:isMobile?"100%":720,margin:"0 auto",padding:isMobile?`20px 16px ${bottomPad}`:"32px 28px 80px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:isMobile?18:24}}>
            <div>{data.subjects.length>0&&<p style={{margin:0,fontSize:isMobile?13:12,color:"#9ca3af",fontWeight:500}}>{data.subjects.length} môn · {data.subjects.reduce((a,s)=>a+(s.lessons?.filter(l=>l.done).length||0),0)}/{data.subjects.reduce((a,s)=>a+(s.lessons?.length||0),0)} bài hoàn thành</p>}</div>
            <button onClick={()=>setShowDashboard(v=>!v)} style={{display:"flex",alignItems:"center",gap:5,background:showDashboard?theme.accentLight:"none",border:`1px solid ${showDashboard?theme.accent+"50":"#e5e7eb"}`,borderRadius:8,color:showDashboard?theme.accentText:"#9ca3af",fontSize:isMobile?12:11,padding:isMobile?"8px 12px":"5px 10px",cursor:"pointer",fontWeight:700,minHeight:isMobile?40:"auto"}}>
              {IC.chart} Tổng quan
            </button>
          </div>
          {showDashboard&&data.subjects.length>0&&<Dashboard subjects={data.subjects} theme={theme} isMobile={isMobile} />}
          {sorted.map(s=><SubjectCard key={s.id} subject={s} theme={theme} isMobile={isMobile} onUpdate={u=>updateSubject(s.id,u)} onDelete={()=>deleteSubject(s.id)} />)}
          {data.subjects.length===0&&!addingSubject&&(
            <div style={{textAlign:"center",padding:"70px 0",color:"#d1d5db"}}>
              <div style={{fontSize:44,marginBottom:14}}>◎</div>
              <div style={{fontSize:isMobile?15:13,fontWeight:500}}>Chưa có môn học nào</div>
            </div>
          )}
          {addingSubject?(
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <input autoFocus value={newSubjectName} onChange={e=>setNewSubjectName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addSubject();if(e.key==="Escape"){setAddingSubject(false);setNewSubjectName("");}}} placeholder="Tên môn học..." style={{flex:1,background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,color:"#111827",fontSize:isMobile?16:14,padding:isMobile?"13px 16px":"10px 14px",outline:"none",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}} />
              <button onClick={addSubject} style={{background:theme.accent,border:"none",borderRadius:10,color:"#fff",fontSize:isMobile?15:13,padding:isMobile?"13px 20px":"10px 18px",cursor:"pointer",fontWeight:700,flexShrink:0}}>Thêm</button>
              <button onClick={()=>{setAddingSubject(false);setNewSubjectName("");}} style={{background:"none",border:"none",color:"#9ca3af",fontSize:isMobile?15:13,cursor:"pointer",flexShrink:0}}>Hủy</button>
            </div>
          ):(
            <button onClick={()=>setAddingSubject(true)} style={{display:"flex",alignItems:"center",gap:8,width:"100%",background:"none",border:`1.5px dashed ${theme.dot}`,borderRadius:isMobile?14:12,color:"#9ca3af",fontSize:isMobile?15:13,padding:isMobile?"16px 18px":"14px 16px",cursor:"pointer",marginTop:6,fontWeight:500,minHeight:isMobile?56:"auto"}}>
              {IC.plus} Thêm môn học
            </button>
          )}
          <p style={{marginTop:44,fontSize:11,color:"#d1d5db",textAlign:"center",letterSpacing:".03em",fontWeight:500}}>Dữ liệu tự động đồng bộ qua đám mây ☁️</p>
        </div>
      ) : activeTab==="lichhoc" ? (
        <CalendarPage theme={theme} isMobile={isMobile} schedule={schedule} onScheduleChange={setSchedule} />
      ) : activeTab==="soanbai" ? (
        <SoanBaiPage theme={theme} isMobile={isMobile} />
      ) : (
        <PlaceholderPage tab={currentTabInfo} theme={theme} isMobile={isMobile} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<App />);
</script>
</body>
</html>

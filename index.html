<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="StudyTodo"/>

<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc;color:#111827;min-height:100vh;}
  button,input,textarea,label,a{touch-action:manipulation;font-family:inherit;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:2px;}
  input[type=date]::-webkit-calendar-picker-indicator{opacity:0.4;cursor:pointer;}
  @media(max-width:500px){input,textarea,select{font-size:18.0px!important;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  #app{min-height:100vh;}

  /* ── Splash screen ── */
  #splash{
    position:fixed;inset:0;z-index:9999;
    background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    transition:opacity .4s ease, visibility .4s ease;
  }
  #splash.hide{opacity:0;visibility:hidden;}
  @keyframes splashPulse{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.08);opacity:.7}
  }
  @keyframes splashBar{
    0%{width:0%}
    60%{width:75%}
    100%{width:100%}
  }
  .splash-wrap{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center;}
  .splash-ring{position:absolute;inset:0;transform:rotate(-90deg);}
  .splash-ring circle.track{stroke:#333;}
  @keyframes splashRing{0%{stroke-dashoffset:471;}100%{stroke-dashoffset:0;}}
  .splash-ring circle.fill{stroke:url(#ringGrad);stroke-dasharray:471;stroke-dashoffset:471;animation:splashRing 1.3s cubic-bezier(.4,0,.2,1) forwards;}
  .splash-logo-img{width:110px;height:110px;object-fit:contain;animation:splashPulse 1.6s ease-in-out infinite;}
  .splash-title-top{font-size:12.0px;letter-spacing:.18em;color:#888;text-transform:uppercase;font-weight:700;margin-top:14px;}
  .splash-title{font-size:28.0px;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1.15;}
</style>

<script>

  var splashHidden = false;
  function hideSplash() {
    if (splashHidden) return;
    splashHidden = true;
    var s = document.getElementById("splash");
    if (s) {
      s.classList.add("hide");
      setTimeout(function(){ s.style.display="none"; }, 420);
    }
  }
  // Fallback: tối đa 6 giây
  window.addEventListener("load", function() {
    setTimeout(hideSplash, 6000);
  });
  // Signal from React khi app đã mount
  window._appReady = function() { hideSplash(); };
</script>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

/* ─── Utils ─── */
function daysLeft(dateStr) {
  if (!dateStr) return null;
  const diff = new Date(dateStr) - new Date();
  return Math.ceil(diff / (1000 * 60 * 60 * 24));
}
function uid() { return Math.random().toString(36).slice(2, 9); }
function toDateKey(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}
function today() { return toDateKey(new Date()); }

const STORAGE_KEY = "studytodo_v3";
const SCHEDULE_KEY = "studytodo_schedule";
const SOANBAI_KEY = "studytodo_soanbai";
const TAICHINH_KEY = "studytodo_taichinh";
function loadData() {
  try { const r = localStorage.getItem(STORAGE_KEY); return r ? JSON.parse(r) : { subjects: [] }; }
  catch { return { subjects: [] }; }
}
function saveData(d) { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(d)); } catch {} }
function loadSchedule() {
  try { const r = localStorage.getItem(SCHEDULE_KEY); return r ? JSON.parse(r) : {}; }
  catch { return {}; }
}
function saveSchedule(s) { try { localStorage.setItem(SCHEDULE_KEY, JSON.stringify(s)); } catch {} }
function loadSoanBai() {
  try { const r = localStorage.getItem(SOANBAI_KEY); return r ? JSON.parse(r) : { subjects: [] }; }
  catch { return { subjects: [] }; }
}
function saveSoanBai(d) { try { localStorage.setItem(SOANBAI_KEY, JSON.stringify(d)); } catch {} }
function loadTaiChinh() {
  try { const r = localStorage.getItem(TAICHINH_KEY); return r ? JSON.parse(r) : { dichLam: 0, chiCungXang: 0, chiCungTietKiem: 0, chiTieuHangNgay: [], chiCungList: [], thuNhapList: [] }; }
  catch { return { dichLam: 0, chiCungXang: 0, chiCungTietKiem: 0, chiTieuHangNgay: [], chiCungList: [], thuNhapList: [] }; }
}
function saveTaiChinh(d) { try { localStorage.setItem(TAICHINH_KEY, JSON.stringify(d)); } catch {} }

/* ─── Firebase Sync Hook ─── */
function useFirebaseSync() {
  const [syncing, setSyncing] = useState(false);
  const [syncOk, setSyncOk] = useState(false);
  const [fbReady, setFbReady] = useState(() => !!window._fbReady);
  const debounceTimers = useRef({});
  const syncOkTimer = useRef(null);
  const isRemoteUpdate = useRef(false); // Cờ: đang nhận từ Firebase, không ghi lại

  useEffect(() => {
    if (window._fbReady) return;
    const handler = () => setFbReady(true);
    window.addEventListener("firebase-ready", handler);
    return () => window.removeEventListener("firebase-ready", handler);
  }, []);

  const pushToFirebase = useCallback(async (key, value) => {
    if (!fbReady || !window._setDoc || !window._fbDoc) return;
    // Nếu đang nhận từ Firebase thì bỏ qua, tránh vòng lặp
    if (isRemoteUpdate.current) return;
    // Debounce 800ms mỗi key riêng biệt
    if (debounceTimers.current[key]) clearTimeout(debounceTimers.current[key]);
    debounceTimers.current[key] = setTimeout(async () => {
      try {
        setSyncing(true);
        await window._setDoc(window._fbDoc("studytodo"), { [key]: JSON.stringify(value) }, { merge: true });
        setSyncOk(true);
        // Tự reset dấu ✓ sau 3 giây
        if (syncOkTimer.current) clearTimeout(syncOkTimer.current);
        syncOkTimer.current = setTimeout(() => setSyncOk(false), 3000);
      } catch(e) { console.error("Firebase write error", e); setSyncOk(false); }
      finally { setSyncing(false); }
    }, 800);
  }, [fbReady]);

  return { fbReady, syncing, syncOk, pushToFirebase, isRemoteUpdate };
}

function useIsMobile() {

  useEffect(() => {
    const fn = () => setMobile(window.innerWidth < 500);

    return () => window.removeEventListener("resize", fn);
  }, []);
  return mobile;
}

const TODO_STORAGE_KEY = "studytodo_todos_v1";
const TODO_HISTORY_KEY = "studytodo_todos_history_v1";
function getTodayStr() { return new Date().toISOString().slice(0,10); }
function loadTodos() {
  try { const d = localStorage.getItem(TODO_STORAGE_KEY); return d ? JSON.parse(d) : []; } catch { return []; }
}
function saveTodos(t) { try { localStorage.setItem(TODO_STORAGE_KEY, JSON.stringify(t)); } catch {} }
function loadTodoHistory() {
  try { const d = localStorage.getItem(TODO_HISTORY_KEY); return d ? JSON.parse(d) : {}; } catch { return {}; }
}
function saveTodoHistory(h) { try { localStorage.setItem(TODO_HISTORY_KEY, JSON.stringify(h)); } catch {} }

const TODO_DAY_KEY = "studytodo_todos_day";
function getLastSavedDay() { return localStorage.getItem(TODO_DAY_KEY) || ""; }
function setLastSavedDay(d) { localStorage.setItem(TODO_DAY_KEY, d); }

function checkAndResetTodos(todos, setTodos) {
  const today = getTodayStr();
  const lastDay = getLastSavedDay();
  if (lastDay && lastDay !== today && todos.length > 0) {
    // Archive yesterday
    const hist = loadTodoHistory();
    hist[lastDay] = todos;
    // Keep only last 14 days
    const keys = Object.keys(hist).sort().reverse();
    keys.slice(14).forEach(k => delete hist[k]);
    saveTodoHistory(hist);
    setTodos([]);
    saveTodos([]);
  }
  setLastSavedDay(today);
}

function formatHistoryDate(dateStr) {
  const d = new Date(dateStr + "T00:00:00");
  const days = ["CN","T2","T3","T4","T5","T6","T7"];
  return `${days[d.getDay()]}, ${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
}

              <span style={{ fontSize:12, fontWeight:700, color: progress===100?"#22c55e":accent }}>{progress}%</span>
            </div>
            <div style={{ height:6, background:"#f0f2f5", borderRadius:99, overflow:"hidden" }}>
              <div style={{ height:"100%", borderRadius:99, background: progress===100
                ? "linear-gradient(90deg,#22c55e,#16a34a)"
                : `linear-gradient(90deg,${accent},${accent}cc)`,
                width:`${progress}%`, transition:"width .4s cubic-bezier(.4,0,.2,1)" }} />
            </div>
          </div>
        )}
      </div>

      {/* ── History panel ── */}
      {showHistory && (
        <div style={{ marginBottom:18, background:"#f8fafc", borderRadius:14,
          border:"1.5px solid #e8edf3", overflow:"hidden" }}>
          <div style={{ padding:"12px 14px", borderBottom:"1px solid #e8edf3",
            fontSize:13, fontWeight:700, color:"#374151", display:"flex", alignItems:"center", gap:7 }}>
            <svg width="14" height="14" fill="none" stroke={accent} strokeWidth="2.2" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
            </svg>
            Lịch sử {historyDays.length > 0 ? `(${historyDays.length} ngày)` : ""}
          </div>
          {historyDays.length === 0 ? (
            <div style={{ padding:"20px 14px", textAlign:"center", fontSize:13, color:"#9ca3af" }}>
              Chưa có lịch sử nào
            </div>
          ) : (
            <div>
              {historyDays.map(day => {
                const dayTodos = history[day] || [];
                const dayDone = dayTodos.filter(t=>t.done).length;
                const isOpen = expandedDay === day;
                return (
                  <div key={day} style={{ borderBottom:"1px solid #eef2f7" }}>
                    <button onClick={()=>setExpandedDay(isOpen ? null : day)} style={{
                      width:"100%", display:"flex", alignItems:"center", justifyContent:"space-between",
                      padding:"10px 14px", background:"none", border:"none", cursor:"pointer",
                      textAlign:"left" }}>
                      <div style={{ display:"flex", alignItems:"center", gap:9 }}>
                        <div style={{ width:8, height:8, borderRadius:99, flexShrink:0,
                          background: dayDone===dayTodos.length && dayTodos.length>0 ? "#22c55e" : "#f59e0b" }} />
                        <span style={{ fontSize:13, fontWeight:600, color:"#374151" }}>{formatHistoryDate(day)}</span>
                      </div>
                      <div style={{ display:"flex", alignItems:"center", gap:8 }}>
                        <span style={{ fontSize:12, color:"#9ca3af", fontWeight:500 }}>
                          {dayDone}/{dayTodos.length} xong
                        </span>
                        <svg width="13" height="13" fill="none" stroke="#9ca3af" strokeWidth="2.2" viewBox="0 0 24 24"
                          style={{ transform: isOpen?"rotate(180deg)":"none", transition:"transform .2s" }}>
                          <polyline points="6 9 12 15 18 9"/>
                        </svg>
                      </div>
                    </button>
                    {isOpen && (
                      <div style={{ padding:"0 14px 12px" }}>
                        {dayTodos.map(t => (
                          <div key={t.id} style={{ display:"flex", alignItems:"center", gap:8, padding:"5px 0",
                            borderBottom:"1px dashed #eef2f7" }}>
                            <div style={{ width:16, height:16, borderRadius:4, flexShrink:0,
                              background: t.done ? accent : "transparent",
                              border:`2px solid ${t.done ? accent : "#d1d5db"}`,
                              display:"flex", alignItems:"center", justifyContent:"center" }}>
                              {t.done && <svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="2,6 5,9 10,3"/></svg>}
                            </div>
                            <span style={{ flex:1, fontSize:12.5, color: t.done?"#9ca3af":"#374151",
                              textDecoration: t.done?"line-through":"none", fontWeight:500 }}>{t.text}</span>
                            {t.time && <span style={{ fontSize:11, color:"#9ca3af" }}>⏰ {t.time}</span>}
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}

      {/* ── Input row ── */}
      <div style={{ display:"flex", gap:8, marginBottom:14, alignItems:"stretch" }}>
        <input ref={inputRef} value={input} onChange={e=>setInput(e.target.value)}
          onKeyDown={e=>{ if(e.key==="Enter") addTodo(); }}
          placeholder="Thêm việc cần làm..."
          style={{ flex:1, border:"1.5px solid #e5e7eb", borderRadius:11, padding:isMobile?"12px 13px":"10px 13px",
            fontSize:isMobile?15:14, fontFamily:"inherit", outline:"none", color:"#111827",
            background:"#fff", transition:"border-color .15s", boxShadow:"0 1px 3px rgba(0,0,0,.05)" }}
          onFocus={e=>e.target.style.borderColor=accent}
          onBlur={e=>e.target.style.borderColor="#e5e7eb"}
        />
        <input type="time" value={time} onChange={e=>setTime(e.target.value)}
          style={{ border:"1.5px solid #e5e7eb", borderRadius:11, padding:"0 10px",
            fontSize:isMobile?14:13, fontFamily:"inherit", outline:"none", color: time?"#111827":"#9ca3af",
            background:"#fff", transition:"border-color .15s", flexShrink:0, cursor:"pointer",
            width: isMobile?108:100, boxShadow:"0 1px 3px rgba(0,0,0,.05)" }}
          onFocus={e=>e.target.style.borderColor=accent}
          onBlur={e=>e.target.style.borderColor="#e5e7eb"}
        />
        <button onClick={addTodo} style={{ background:accent, border:"none", borderRadius:11,
          color:"#fff", padding:isMobile?"0 17px":"0 15px", cursor:"pointer",
          display:"flex", alignItems:"center", justifyContent:"center", flexShrink:0,
          boxShadow:`0 2px 8px ${accent}55`, transition:"transform .1s, box-shadow .1s" }}
          onMouseEnter={e=>{ e.currentTarget.style.transform="scale(1.05)"; }}
          onMouseLeave={e=>{ e.currentTarget.style.transform="scale(1)"; }}>
          <svg width="16" height="16" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round">
            <line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/>
          </svg>
        </button>
      </div>

      {/* ── List ── */}
      {sorted.length === 0 ? (
        <div style={{ textAlign:"center", padding:"52px 0" }}>
          <div style={{ fontSize:40, marginBottom:12 }}>✨</div>
          <div style={{ fontSize:15, fontWeight:700, color:"#9ca3af" }}>Hôm nay chưa có việc gì!</div>
          <div style={{ fontSize:13, color:"#d1d5db", marginTop:4, fontWeight:500 }}>Thêm việc cần làm ở trên nhé</div>
        </div>
      ) : (
        <div style={{ display:"flex", flexDirection:"column", gap:9 }}>
          {sorted.map((todo, idx) => {
            // Subtle left-border color for active items
            const borderAccent = todo.done ? borderDone : borderNormal;
            return (
              <div key={todo.id} style={{
                display:"flex", alignItems:"center", gap:11,
                background: todo.done ? cardDone : cardBg,
                border:`1.5px solid ${borderAccent}`,
                borderLeft: todo.done ? `3px solid #d1fae5` : `3px solid ${accent}`,
                borderRadius:13, padding: isMobile?"12px 12px":"10px 12px",
                transition:"all .2s", opacity: todo.done ? 0.72 : 1,
                boxShadow: todo.done ? "none" : "0 1px 4px rgba(0,0,0,.04)" }}>

                <button onClick={() => toggleDone(todo.id)} style={{
                  width:24, height:24, borderRadius:7, border:`2px solid ${todo.done ? "#22c55e" : "#d1d5db"}`,
                  background: todo.done ? "#22c55e" : "transparent", flexShrink:0, cursor:"pointer",
                  display:"flex", alignItems:"center", justifyContent:"center", transition:"all .18s", padding:0 }}>
                  {todo.done && <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" strokeWidth="2.4" strokeLinecap="round" strokeLinejoin="round"><polyline points="2,6 5,9 10,3"/></svg>}
                </button>

                <span style={{ flex:1, fontSize: isMobile?15:14, color: todo.done ? "#9ca3af" : "#111827",
                  textDecoration: todo.done ? "line-through" : "none", fontWeight: todo.done ? 400 : 500,
                  lineHeight:1.45, wordBreak:"break-word", transition:"all .2s" }}>
                  {todo.text}
                </span>

                {todo.time && (
                  <span style={{ fontSize:11.5, fontWeight:600,
                    color: todo.done ? "#d1d5db" : accent,
                    background: todo.done ? "#f3f4f6" : accentLight,
                    borderRadius:6, padding:"3px 8px", flexShrink:0, whiteSpace:"nowrap",
                    border: todo.done ? "1px solid #eee" : `1px solid ${accent}33` }}>
                    ⏰ {todo.time}
                  </span>
                )}

                <button onClick={() => deleteTodo(todo.id)} style={{
                  background:"transparent", border:"none", cursor:"pointer", color:"#c4cad4",
                  display:"flex", alignItems:"center", justifyContent:"center",
                  width:30, height:30, borderRadius:8, flexShrink:0, transition:"all .12s", padding:0 }}
                  onMouseEnter={e=>{ e.currentTarget.style.background="#fef2f2"; e.currentTarget.style.color="#ef4444"; }}
                  onMouseLeave={e=>{ e.currentTarget.style.background="transparent"; e.currentTarget.style.color="#c4cad4"; }}>
                  <svg width="15" height="15" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                    <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                    <path d="M9 6V4h6v2"/>
                  </svg>
                </button>
              </div>
            );
          })}

          {doneCount > 0 && activeCount === 0 && (
            <div style={{ textAlign:"center", padding:"18px 0 6px" }}>
              <div style={{ fontSize:22, marginBottom:6 }}>🎉</div>
              <div style={{ fontSize:13.5, fontWeight:700, color:"#22c55e" }}>Xong hết rồi! Tuyệt vời!</div>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

    <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
      <div style={{ display: "flex", alignItems: "center", gap: 7,

        borderRadius: 8,
        padding: isMobile ? "8px 10px" : "6px 10px",
        transition: "background .2s, border-color .2s" }}>
        <span style={{ color: printed ? "#16a34a" : "#9ca3af", flexShrink: 0, display: "flex" }}>
          {isImg ? (
            <svg width="16" height="16" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
              <rect x="3" y="3" width="20" height="20" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/>
              <polyline points="21 15 16 10 5 21"/>

        <button
          onClick={() => onTogglePrinted(!printed)}
          title={printed ? "Bỏ đánh dấu đã in" : "Đánh dấu đã in"}
          style={{
            display: "flex", alignItems: "center", gap: 3,
            fontSize: 12, fontWeight: 700,
            background: printed ? "#dcfce7" : "#f3f4f6",
            color: printed ? "#16a34a" : "#9ca3af",
            border: `1px solid ${printed ? "#86efac" : "#e5e7eb"}`,
            borderRadius: 6,
            padding: isMobile ? "5px 8px" : "3px 7px",
            cursor: "pointer", flexShrink: 0,
            minHeight: isMobile ? 32 : "auto",
            letterSpacing: ".02em",
            transition: "all .15s"
          }}>
          <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24" style={{flexShrink:0}}>
            <polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="14" height="10"/>
          </svg>
          {printed ? "Đã in" : "In"}
        </button>
        {isImg && (
          <button onClick={() => setShowImg(v => !v)}

              cursor: "pointer", padding: "0 6px", minHeight: 36, display: "flex", alignItems: "center" }}>
            {showImg ? "ẩn" : "xem"}
          </button>

        {mat.dataUrl && !isImg && (
          <a href={mat.dataUrl} download={mat.name}
            style={{ fontSize: 13, color: "#9ca3af", textDecoration: "none",
              padding: "0 6px", minHeight: 36, display: "flex", alignItems: "center" }}>tải</a>
        )}
        <button onClick={onDelete}
          style={{ color: "#d1d5db", background: "none", border: "none", cursor: "pointer",
            padding: isMobile ? "0 4px" : "0 2px", minWidth: 32, minHeight: 36,
            display: "flex", alignItems: "center", justifyContent: "center" }}>
          {IC.trash}

      </div>
      {isImg && showImg && mat.dataUrl && (
        <img src={mat.dataUrl} alt={mat.name}

/* ─── TaiLieuDaySection ─── */
function TaiLieuDaySection({ lessons, onUpdate, theme, isMobile, dot, accent }) {
  const { accentLight, accentText } = theme;
  const [addingLesson, setAddingLesson] = useState(false);
  const [newTitle, setNewTitle] = useState("");
  const [openLessonId, setOpenLessonId] = useState(null);

  const addLesson = () => {
    if (!newTitle.trim()) return;
    const newLesson = { id: uid(), title: newTitle.trim(), note: "", materials: [] };
    onUpdate([...lessons, newLesson]);
    setNewTitle(""); setAddingLesson(false);
    setOpenLessonId(newLesson.id);
  };

  const updateLesson = (id, patch) =>
    onUpdate(lessons.map(l => l.id === id ? { ...l, ...patch } : l));

  const deleteLesson = (id) => { onUpdate(lessons.filter(l => l.id !== id)); setOpenLessonId(null); };

  const handleUpload = (lessonId, e) => {
    Array.from(e.target.files).forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => {
        onUpdate(lessons.map(l => l.id === lessonId
          ? { ...l, materials: [...(l.materials || []), { id: uid(), name: f.name, type: f.type, dataUrl: ev.target.result }] }
          : l));
      };
      reader.readAsDataURL(f);
    });
    e.target.value = "";
  };

  const deleteMaterial = (lessonId, matId) =>
    onUpdate(lessons.map(l => l.id === lessonId
      ? { ...l, materials: (l.materials || []).filter(m => m.id !== matId) }
      : l));

  const renameMaterial = (lessonId, matId, name) =>
    onUpdate(lessons.map(l => l.id === lessonId
      ? { ...l, materials: (l.materials || []).map(m => m.id === matId ? { ...m, name } : m) }
      : l));

  const togglePrinted = (lessonId, matId, value) =>
    onUpdate(lessons.map(l => l.id === lessonId
      ? { ...l, materials: (l.materials || []).map(m => m.id === matId ? { ...m, printed: value } : m) }
      : l));

  const openLesson = openLessonId ? lessons.find(l => l.id === openLessonId) : null;

  if (lessons.length === 0 && !addingLesson) return (
    <div style={{ display: "flex", flexDirection: "column", alignItems: "center", gap: 10, padding: "28px 0 10px" }}>
      <div style={{ fontSize: 38 }}>📂</div>
      <div style={{ fontSize: 15, color: "#d1d5db", fontWeight: 500 }}>Chưa có bài nào</div>
      <button onClick={() => setAddingLesson(true)} style={{
        display: "flex", alignItems: "center", gap: 6, background: "none",
        border: `1.5px dashed ${dot}`, borderRadius: 10, color: "#9ca3af",
        fontSize: isMobile ? 14 : 13, padding: isMobile ? "12px 20px" : "9px 16px",
        cursor: "pointer", fontWeight: 500 }}>
        {IC.plus} Thêm bài
      </button>
    </div>
  );

  return (
    <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
      {/* Chip grid */}
      {lessons.length > 0 && (
        <div style={{ display: "flex", flexWrap: "wrap", gap: isMobile ? 8 : 6 }}>
          {lessons.map(lesson => {
            const matCount = (lesson.materials || []).length;
            const printedCount = (lesson.materials || []).filter(m => m.printed).length;
            const hasNote = (lesson.note || "").trim().length > 0;
            return (
              <button key={lesson.id} onClick={() => setOpenLessonId(lesson.id)} style={{
                display: "flex", alignItems: "center", gap: 6,
                background: "#fff", border: `1.5px solid ${accent}33`,
                borderRadius: 10, padding: isMobile ? "9px 12px" : "7px 11px",
                cursor: "pointer", fontFamily: "inherit",
                boxShadow: "0 1px 4px rgba(0,0,0,.06)",
                transition: "border-color .15s, box-shadow .15s",
                maxWidth: "100%",
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = accent; e.currentTarget.style.boxShadow = `0 2px 8px ${accent}22`; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = `${accent}33`; e.currentTarget.style.boxShadow = "0 1px 4px rgba(0,0,0,.06)"; }}
              >
                <span style={{ color: accent, flexShrink: 0, display: "flex", fontSize: 14 }}>{IC.filetext}</span>
                <span style={{ fontSize: isMobile ? 13 : 12, fontWeight: 600, color: "#1f2937",
                  overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", maxWidth: 130 }}>
                  {lesson.title}
                </span>
                {matCount > 0 && (
                  <span style={{ fontSize: 11, fontWeight: 700, background: accentLight,
                    color: accentText, borderRadius: 20, padding: "1px 7px", flexShrink: 0 }}>
                    {matCount}
                  </span>
                )}
                {printedCount > 0 && printedCount === matCount && (
                  <span style={{ fontSize: 11, flexShrink: 0 }}>🖨</span>
                )}
                {hasNote && (
                  <span style={{ fontSize: 11, color: "#9ca3af", flexShrink: 0 }}>✎</span>
                )}
              </button>
            );
          })}
        </div>
      )}

      {/* Add lesson */}
      {addingLesson ? (
        <div style={{ display: "flex", gap: 8 }}>
          <input autoFocus value={newTitle}
            onChange={e => setNewTitle(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") addLesson(); if (e.key === "Escape") { setAddingLesson(false); setNewTitle(""); } }}
            placeholder="Tên bài học..."
            style={{ flex: 1, background: "#fff", border: "1px solid #e5e7eb", borderRadius: 9,
              color: "#111827", fontSize: isMobile ? 16 : 13, padding: isMobile ? "12px 14px" : "8px 12px",
              outline: "none" }} />
          <button onClick={addLesson} style={{ background: accent, border: "none", borderRadius: 9,
            color: "#fff", fontSize: isMobile ? 14 : 13, padding: isMobile ? "12px 18px" : "8px 14px",
            cursor: "pointer", fontWeight: 700, flexShrink: 0 }}>Thêm</button>
          <button onClick={() => { setAddingLesson(false); setNewTitle(""); }}
            style={{ background: "none", border: "none", color: "#9ca3af",
              fontSize: isMobile ? 14 : 13, cursor: "pointer", flexShrink: 0 }}>Hủy</button>
        </div>
      ) : (
        <button onClick={() => setAddingLesson(true)} style={{
          display: "flex", alignItems: "center", gap: 7, width: "100%", background: "none",
          border: `1.5px dashed ${dot}`, borderRadius: 10, color: "#9ca3af",
          fontSize: isMobile ? 14 : 13, padding: isMobile ? "11px 14px" : "8px 12px",
          cursor: "pointer", fontWeight: 500, minHeight: isMobile ? 44 : "auto" }}>
          {IC.plus} Thêm bài
        </button>
      )}

      {/* Detail modal */}
      {openLesson && (
        <LessonDetailModal
          lesson={openLesson}
          accent={accent} accentLight={accentLight} accentText={accentText}
          isMobile={isMobile} dot={dot}
          onClose={() => setOpenLessonId(null)}
          onUpdate={patch => updateLesson(openLesson.id, patch)}
          onDelete={() => deleteLesson(openLesson.id)}
          onUpload={(id, e) => handleUpload(id, e)}
          onDeleteMat={matId => deleteMaterial(openLesson.id, matId)}
          onRenameMat={(matId, n) => renameMaterial(openLesson.id, matId, n)}
          onTogglePrinted={(matId, v) => togglePrinted(openLesson.id, matId, v)}
        />
      )}
    </div>
  );
}

/* ─── SoanBaiSubjectCard ─── */
function SoanBaiSubjectCard({ subject, theme, isMobile, onUpdate, onDelete }) {
  const { accent, accentLight, accentText, dot } = theme;
  const [activeSection, setActiveSection] = useState("lichhoc");
  const [open, setOpen] = useState(false);

  const updateScheduleRow = (idx, patch) => {
    const rows = [...(subject.scheduleRows || [])];
    rows[idx] = { ...rows[idx], ...patch };
    onUpdate({ ...subject, scheduleRows: rows });
  };
  const addScheduleRow = () => {
    const rows = [...(subject.scheduleRows || []), { id: uid(), day: "", startTime: "", endTime: "", room: "", note: "" }];
    onUpdate({ ...subject, scheduleRows: rows });
  };
  const deleteScheduleRow = (idx) => {
    const rows = (subject.scheduleRows || []).filter((_,i) => i !== idx);
    onUpdate({ ...subject, scheduleRows: rows });
  };

  const salary = subject.salary || {};
  const updateSalary = (patch) => onUpdate({ ...subject, salary: { ...salary, ...patch } });

  const DAYS = ["Thứ 2","Thứ 3","Thứ 4","Thứ 5","Thứ 6","Thứ 7","Chủ Nhật"];

  const inputStyle = {
    background: "#f9fafb", border: "1px solid #e5e7eb", borderRadius: 7,
    color: "#374151", fontSize: isMobile ? 14 : 13, padding: isMobile ? "9px 10px" : "6px 10px",
    outline: "none", fontFamily: "inherit", width: "100%",
  };
  const labelStyle = { fontSize: 13, fontWeight: 700, color: "#9ca3af", letterSpacing: ".05em", textTransform: "uppercase", marginBottom: 4, display: "block" };

  // Tính lương ước tính
  const sessionsPerWeek = (subject.scheduleRows || []).filter(r => r.day).length;
  const hoursPerSession = (salary.hoursPerSession && parseFloat(salary.hoursPerSession)) || 0;
  const ratePerHour = (salary.ratePerHour && parseFloat(salary.ratePerHour)) || 0;
  const weeksPerMonth = (salary.weeksPerMonth && parseFloat(salary.weeksPerMonth)) || 4;
  const estimatedMonthly = sessionsPerWeek * hoursPerSession * ratePerHour * weeksPerMonth;

  return (
    <div style={{ background: "#fff", border: "1px solid #e5e7eb", borderRadius: isMobile ? 14 : 12, overflow: "hidden", marginBottom: isMobile ? 12 : 10, boxShadow: "0 1px 6px rgba(0,0,0,.05)" }}>

        <span style={{ color: accent, flexShrink: 0 }}>{IC.pen}</span>
        <div style={{ flex: 1, minWidth: 0 }}>
          <EditableText value={subject.name} onSave={n => onUpdate({ ...subject, name: n })} isMobile={isMobile} style={{ fontSize: isMobile ? 17 : 15, fontWeight: 700, color: "#111827", letterSpacing: "-.01em" }} placeholder="Tên môn học" />
        </div>
        <button onClick={onDelete} style={{ color: "#e5e7eb", background: "none", border: "none", cursor: "pointer", display: "flex", padding: isMobile ? 6 : 4, minWidth: isMobile ? 40 : 28, minHeight: isMobile ? 44 : "auto", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>{IC.trash}</button>
      </div>

      {open && (
        <div style={{ padding: isMobile ? "0 14px 16px" : "0 16px 14px" }}>
          <div style={{ height: 1, background: "#f3f4f6", marginBottom: 12 }} />

          {/* Section Tabs */}
          <div style={{ display: "flex", marginBottom: 14, borderBottom: "1px solid #f3f4f6", overflowX: "auto", scrollbarWidth: "none" }}>
            {[["lichhoc", IC.calendar, "Lịch dạy"], ["tailieu", IC.folder, "Tài liệu dạy"], ["luong", IC.wallet, "Lương"]].map(([k, icon, label]) => (

              </button>

          </div>

          {/* Lịch dạy */}

            <div>

                <div style={{ textAlign: "center", padding: "24px 0 16px", color: "#d1d5db", fontSize: 15 }}>Chưa có lịch dạy nào</div>

                          <option value="">-- Chọn ngày --</option>
                          {DAYS.map(d => <option key={d} value={d}>{d}</option>)}

                      </div>
                      <button onClick={() => deleteScheduleRow(idx)} style={{ color: "#d1d5db", background: "none", border: "none", cursor: "pointer", padding: 4, display: "flex", minHeight: isMobile ? 36 : "auto", alignItems: "center" }}>{IC.trash}</button>

                      <span style={labelStyle}>Phòng / Địa điểm</span>

          {/* Tài liệu dạy */}
          {activeSection === "tailieu" && (
            <TaiLieuDaySection
              lessons={subject.lessons || []}

              isMobile={isMobile}
              dot={dot}

          {activeSection === "luong" && (

                  <div style={{ background: "#fff", borderRadius: 8, padding: "10px 12px", border: `1px solid ${accent}18` }}>

                    <div style={{ fontSize: isMobile ? 18 : 17, fontWeight: 800, color: accentText }}>{sessionsPerWeek}</div>

                  <div style={{ background: "#fff", borderRadius: 8, padding: "10px 12px", border: `1px solid ${accent}18` }}>
                    <div style={{ fontSize: 13, color: "#9ca3af", marginBottom: 3 }}>Giờ / tháng</div>
                    <div style={{ fontSize: isMobile ? 18 : 17, fontWeight: 800, color: accentText }}>{(sessionsPerWeek * hoursPerSession * weeksPerMonth).toFixed(1)}</div>

/* ─── SoanBaiPage ─── */
function SoanBaiPage({ theme, isMobile, soanBaiData, setSoanBaiData }) {
  const { accent, dot } = theme;
  const [addingSubject, setAddingSubject] = useState(false);
  const [newName, setNewName] = useState("");

  const addSubject = () => {
    if (!newName.trim()) return;
    setSoanBaiData(d => ({ ...d, subjects: [...d.subjects, { id: uid(), name: newName.trim(), scheduleRows: [], salary: {} }] }));
    setNewName(""); setAddingSubject(false);
  };
  const updateSubject = (id, u) => setSoanBaiData(d => ({ ...d, subjects: d.subjects.map(s => s.id === id ? u : s) }));
  const deleteSubject = (id) => setSoanBaiData(d => ({ ...d, subjects: d.subjects.filter(s => s.id !== id) }));
  const bottomPad = isMobile ? "calc(24px + env(safe-area-inset-bottom))" : "80px";

  return (
    <div style={{ maxWidth: isMobile ? "100%" : 720, margin: "0 auto", padding: isMobile ? `20px 16px ${bottomPad}` : "32px 28px 80px" }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: isMobile ? 18 : 24 }}>
        <p style={{ margin: 0, fontSize: isMobile ? 13 : 12, color: "#9ca3af", fontWeight: 500 }}>
          {soanBaiData.subjects.length > 0 ? `${soanBaiData.subjects.length} môn dạy` : ""}
        </p>
      </div>

      {soanBaiData.subjects.length === 0 && !addingSubject && (
        <div style={{ textAlign: "center", padding: "70px 0", color: "#d1d5db" }}>
          <div style={{ fontSize: 46, marginBottom: 14 }}>✏️</div>
          <div style={{ fontSize: isMobile ? 15 : 13, fontWeight: 500 }}>Chưa có môn dạy nào</div>
        </div>
      )}

      {soanBaiData.subjects.map(s => (
        <SoanBaiSubjectCard key={s.id} subject={s} theme={theme} isMobile={isMobile}
          onUpdate={u => updateSubject(s.id, u)}
          onDelete={() => deleteSubject(s.id)} />
      ))}

      {addingSubject ? (
        <div style={{ display: "flex", gap: 8, marginTop: 10 }}>
          <input autoFocus value={newName} onChange={e => setNewName(e.target.value)}
            onKeyDown={e => { if (e.key === "Enter") addSubject(); if (e.key === "Escape") { setAddingSubject(false); setNewName(""); } }}
            placeholder="Tên môn học..." style={{ flex: 1, background: "#fff", border: "1px solid #e5e7eb", borderRadius: 10, color: "#111827", fontSize: isMobile ? 16 : 14, padding: isMobile ? "13px 16px" : "10px 14px", outline: "none", boxShadow: "0 1px 4px rgba(0,0,0,.06)" }} />
          <button onClick={addSubject} style={{ background: accent, border: "none", borderRadius: 10, color: "#fff", fontSize: isMobile ? 15 : 13, padding: isMobile ? "13px 20px" : "10px 18px", cursor: "pointer", fontWeight: 700, flexShrink: 0 }}>Thêm</button>
          <button onClick={() => { setAddingSubject(false); setNewName(""); }} style={{ background: "none", border: "none", color: "#9ca3af", fontSize: isMobile ? 15 : 13, cursor: "pointer", flexShrink: 0 }}>Hủy</button>
        </div>
      ) : (
        <button onClick={() => setAddingSubject(true)} style={{ display: "flex", alignItems: "center", gap: 8, width: "100%", background: "none", border: `1.5px dashed ${dot}`, borderRadius: isMobile ? 14 : 12, color: "#9ca3af", fontSize: isMobile ? 15 : 13, padding: isMobile ? "16px 18px" : "14px 16px", cursor: "pointer", marginTop: 6, fontWeight: 500, minHeight: isMobile ? 56 : "auto" }}>
          {IC.plus} Thêm môn dạy
        </button>
      )}

    </div>
  );
}

/* ─── CountdownBadge ─── */
function CountdownBadge({ date, accent, large }) {
  const days = daysLeft(date);
  if (days === null) return null;
  let color, bg;
  if (days < 0)       { color="#9ca3af"; bg="#f3f4f6"; }
  else if (days <= 3) { color="#dc2626"; bg="#fef2f2"; }
  else if (days <= 7) { color="#d97706"; bg="#fffbeb"; }
  else                { color=accent||"#5c6bc0"; bg=(accent||"#5c6bc0")+"18"; }
  const label = days < 0 ? "Đã qua" : days === 0 ? "Hôm nay!" : `${days} ngày`;
  return (
    <span style={{fontSize:large?12:11,fontWeight:700,letterSpacing:".04em",color,background:bg,border:`1px solid ${color}25`,borderRadius:20,padding:large?"3px 10px":"2px 8px",whiteSpace:"nowrap",display:"inline-flex",alignItems:"center",gap:3,flexShrink:0}}>
      {IC.clock} {label}
    </span>
  );
}

/* ─── EditableText ─── */
function EditableText({ value, onSave, style, placeholder, isMobile }) {
  const [editing, setEditing] = useState(false);
  const [val, setVal] = useState(value);
  const ref = useRef();
  useEffect(() => { if (editing) ref.current?.focus(); }, [editing]);
  const commit = () => { setEditing(false); if (val.trim()) onSave(val.trim()); else setVal(value); };
  if (editing) return (
    <input ref={ref} value={val} onChange={e => setVal(e.target.value)} onBlur={commit}
      onKeyDown={e => { if (e.key==="Enter") commit(); if (e.key==="Escape") { setVal(value); setEditing(false); } }}
      style={{...style,background:"transparent",border:"none",borderBottom:"1.5px solid #a5b4fc",outline:"none",padding:0,width:"100%",color:"inherit",fontSize:isMobile?16:(style.fontSize||14)}} />
  );
  return (
    <span style={{...style,cursor:"text",display:"inline-flex",alignItems:"center",gap:4}} onClick={() => setEditing(true)}>
      {value || <span style={{color:"#d1d5db"}}>{placeholder}</span>}
      <span style={{opacity:0.2,flexShrink:0}}>{IC.edit}</span>
    </span>
  );
}

/* ─── FileItem ─── */
function FileItem({ file, onDelete, onRename, isMobile }) {
  const isImage = file.type?.startsWith("image/");
  const [showImg, setShowImg] = useState(false);
  return (
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      <div style={{display:"flex",alignItems:"center",gap:8,padding:isMobile?"10px 12px":"6px 10px",background:"#f9fafb",border:"1px solid #e5e7eb",borderRadius:8}}>
        <span style={{color:"#9ca3af",flexShrink:0}}>{IC.file}</span>
        <EditableText value={file.name} onSave={onRename} style={{flex:1,fontSize:15,color:"#374151"}} placeholder="Tên tài liệu" isMobile={isMobile} />
        {isImage && <button onClick={() => setShowImg(v=>!v)} style={{fontSize:14,color:"#9ca3af",background:"none",border:"none",cursor:"pointer",padding:"0 6px",minHeight:44,display:"flex",alignItems:"center"}}>{showImg?"ẩn":"xem"}</button>}
        {file.dataUrl && !isImage && <a href={file.dataUrl} download={file.name} style={{fontSize:14,color:"#9ca3af",textDecoration:"none",padding:"0 6px",minHeight:44,display:"flex",alignItems:"center"}}>tải</a>}
        <button onClick={onDelete} style={{color:"#d1d5db",background:"none",border:"none",cursor:"pointer",padding:isMobile?"0 4px":"0 2px",minWidth:36,minHeight:44,display:"flex",alignItems:"center",justifyContent:"center"}}>{IC.trash}</button>
      </div>
      {isImage && showImg && file.dataUrl && <img src={file.dataUrl} alt={file.name} style={{maxWidth:"100%",maxHeight:220,borderRadius:8,objectFit:"contain",background:"#f9fafb",border:"1px solid #e5e7eb"}} />}
    </div>
  );
}

/* ─── MaterialsSection ─── */
function MaterialsSection({ materials, onChange, isMobile }) {
  const fileInputRef = useRef();
  const handleUpload = (e) => {
    Array.from(e.target.files).forEach(f => {
      const reader = new FileReader();
      reader.onload = ev => onChange([...materials, { id:uid(), name:f.name, type:f.type, dataUrl:ev.target.result }]);
      reader.readAsDataURL(f);
    });
    e.target.value = "";
  };
  return (
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      {materials.map(m => (
        <FileItem key={m.id} file={m} isMobile={isMobile}
          onDelete={() => onChange(materials.filter(x=>x.id!==m.id))}
          onRename={n => onChange(materials.map(x=>x.id===m.id?{...x,name:n}:x))} />

// Tính số tuần của ngày d tính từ semesterStart (tuần 1 = tuần chứa ngày đầu HK)
function getWeekNumber(dateStr, semesterStart) {
  if (!semesterStart) return null;
  const d = new Date(dateStr + "T00:00:00");
  const s = new Date(semesterStart + "T00:00:00");
  // Lùi về đầu tuần (Thứ 2) của semesterStart
  const dow = s.getDay(); // 0=CN
  const startMonday = new Date(s);
  startMonday.setDate(s.getDate() - (dow === 0 ? 6 : dow - 1));
  const diff = Math.floor((d - startMonday) / (7 * 86400000));
  return diff >= 0 ? diff + 1 : null;
}

// Sinh ra các ngày học trong tháng dựa theo quy luật
function generateDaysInMonth(rule, year, month, semesterStart) {
  const days = [];
  const lastDay = new Date(year, month + 1, 0).getDate();
  for (let d = 1; d <= lastDay; d++) {
    const date = new Date(year, month, d);
    if (date.getDay() !== rule.dayOfWeek) continue;
    const dateStr = toDateKey(date);
    if (!semesterStart) { days.push(dateStr); continue; }
    const wn = getWeekNumber(dateStr, semesterStart);
    if (wn === null) continue;
    // weekFrom / weekTo range filter
    const wf = rule.weekFrom ? parseInt(rule.weekFrom) : null;
    const wt = rule.weekTo   ? parseInt(rule.weekTo)   : null;
    if (wf !== null && wn < wf) continue;
    if (wt !== null && wn > wt) continue;
    const pat = rule.weekPattern;
    if (pat === "all") { days.push(dateStr); }
    else if (pat === "odd")  { if (wn % 2 === 1) days.push(dateStr); }
    else if (pat === "even") { if (wn % 2 === 0) days.push(dateStr); }
    else {
      const allowed = pat.split(",").map(x => parseInt(x.trim()));
      const mod4 = ((wn - 1) % 4) + 1;
      if (allowed.includes(mod4)) days.push(dateStr);
    }
  }
  return days;
}

const WEEK_PATTERNS = [
  { value: "all",   label: "Mỗi tuần" },
  { value: "odd",   label: "Tuần lẻ (1,3,5...)" },
  { value: "even",  label: "Tuần chẵn (2,4,6...)" },
  { value: "1,3",   label: "Tuần 1 & 3 / tháng" },
  { value: "2,4",   label: "Tuần 2 & 4 / tháng" },
  { value: "1",     label: "Tuần 1 / tháng" },
  { value: "2",     label: "Tuần 2 / tháng" },
  { value: "3",     label: "Tuần 3 / tháng" },
  { value: "4",     label: "Tuần 4 / tháng" },
];
const BUOI_OPTIONS = [
  { value: "sang",   label: "🌅 Sáng",   time: "07:00–10:50", color: "#f97316", bg: "#fff7ed", border: "#fed7aa" },
  { value: "chieu",  label: "☀️ Chiều",  time: "13:30–17:20", color: "#22c55e", bg: "#f0fdf4", border: "#bbf7d0" },
  { value: "toi",    label: "🌙 Tối",    time: "17:30–21:00", color: "#3b82f6", bg: "#eff6ff", border: "#bfdbfe" },
];
const LOAI_OPTIONS = [
  { value: "lt", label: "Lý thuyết", color: "#5c6bc0", bg: "#e8eaf6" },
  { value: "th", label: "Thực hành", color: "#0891b2", bg: "#e0f2fe" },
];
const TIET_START = [
  { tiet:1, time:"07:00" },{ tiet:2, time:"08:00" },{ tiet:3, time:"09:00" },
  { tiet:4, time:"10:00" },{ tiet:5, time:"13:30" },{ tiet:6, time:"14:30" },
  { tiet:7, time:"15:30" },{ tiet:8, time:"16:30" },
];
function tietEndTime(tietTo) {
  const e = TIET_START.find(t => t.tiet === tietTo);
  if (!e) return "";
  const [eh,em] = e.time.split(":").map(Number);
  const endMin = eh*60+em+50;
  return String(Math.floor(endMin/60)).padStart(2,"0")+":"+String(endMin%60).padStart(2,"0");
}
const DOW_OPTIONS = [
  { value: 1, label: "T2" }, { value: 2, label: "T3" }, { value: 3, label: "T4" },
  { value: 4, label: "T5" }, { value: 5, label: "T6" }, { value: 6, label: "T7" },
  { value: 0, label: "CN" },
];

function RuleForm({ rule, onChange, onDelete, theme, isMobile }) {
  const inp = { background:"#f9fafb", border:"1px solid #e5e7eb", borderRadius:7, color:"#374151",
    fontSize: isMobile?14:13, padding: isMobile?"9px 10px":"6px 10px", outline:"none",
    fontFamily:"inherit", width:"100%", cursor:"pointer" };
  const lbl = { fontSize:13, fontWeight:700, color:"#9ca3af", letterSpacing:".05em",
    textTransform:"uppercase", marginBottom:4, display:"block" };
  const upd = (k,v) => onChange({ ...rule, [k]: v });
  const buoi = BUOI_OPTIONS.find(b => b.value === rule.buoi) || BUOI_OPTIONS[0];
  const loai = LOAI_OPTIONS.find(l => l.value === rule.loai) || LOAI_OPTIONS[0];

  // Khi chọn tiết, tự tính giờ
  const handleTietFrom = (val) => {
    const tf = val ? parseInt(val) : null;
    const tt = rule.tietTo ? parseInt(rule.tietTo) : null;
    const safeTo = tt && tf && tt >= tf ? tt : tf;
    const s = tf ? TIET_START.find(t=>t.tiet===tf) : null;
    const e = safeTo ? tietEndTime(safeTo) : "";
    upd("tietFrom", val);
    upd("tietTo", safeTo ? String(safeTo) : "");
    if (s) onChange({ ...rule, tietFrom: val, tietTo: safeTo ? String(safeTo) : "", startTime: s.time, endTime: e });
  };
  const handleTietTo = (val) => {
    const tf = rule.tietFrom ? parseInt(rule.tietFrom) : null;
    const tt = val ? parseInt(val) : null;
    const e = tt ? tietEndTime(tt) : "";
    const s = tf ? TIET_START.find(t=>t.tiet===tf) : null;
    onChange({ ...rule, tietTo: val, endTime: e, startTime: s ? s.time : rule.startTime });
  };

  return (
    <div style={{ background:"#f9fafb", border:"1px solid #e5e7eb", borderRadius:12,
      padding: isMobile?"12px":"10px 14px", marginBottom:10 }}>
      {/* Row 1: Thứ + Buổi + Loại */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:8, marginBottom:8 }}>
        <div>
          <span style={lbl}>Thứ</span>
          <select value={rule.dayOfWeek} onChange={e=>upd("dayOfWeek",+e.target.value)} style={inp}>
            {DOW_OPTIONS.map(d => <option key={d.value} value={d.value}>{d.label}</option>)}
          </select>
        </div>
        <div>
          <span style={lbl}>Buổi</span>
          <select value={rule.buoi} onChange={e=>upd("buoi",e.target.value)} style={inp}>
            {BUOI_OPTIONS.map(b => <option key={b.value} value={b.value}>{b.label}</option>)}
          </select>
        </div>
        <div>
          <span style={lbl}>Loại</span>
          <select value={rule.loai} onChange={e=>upd("loai",e.target.value)} style={inp}>
            {LOAI_OPTIONS.map(l => <option key={l.value} value={l.value}>{l.label}</option>)}
          </select>
        </div>
      </div>

      {/* Row 2: Quy luật tuần + Phòng */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
        <div>
          <span style={lbl}>Quy luật tuần</span>
          <select value={rule.weekPattern} onChange={e=>upd("weekPattern",e.target.value)} style={inp}>
            {WEEK_PATTERNS.map(p => <option key={p.value} value={p.value}>{p.label}</option>)}
          </select>
        </div>
        <div>
          <span style={lbl}>Phòng học</span>
          <input value={rule.room||""} onChange={e=>upd("room",e.target.value)}
            placeholder="A101, Lab2..." style={inp} />
        </div>
      </div>

      {/* Row 3: Từ tuần ... đến tuần ... */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:8, marginBottom:8 }}>
        <div>
          <span style={lbl}>Từ tuần HK</span>
          <input type="number" min="1" max="52" value={rule.weekFrom||""} onChange={e=>upd("weekFrom",e.target.value)}
            placeholder="VD: 1" style={inp} />
        </div>
        <div>
          <span style={lbl}>Đến tuần HK</span>
          <input type="number" min="1" max="52" value={rule.weekTo||""} onChange={e=>upd("weekTo",e.target.value)}
            placeholder="VD: 15" style={inp} />
        </div>
      </div>

      {/* Row 4: Tiết + Giờ */}
      <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr 1fr", gap:8, marginBottom:8 }}>
        <div>
          <span style={lbl}>Từ tiết</span>
          <select value={rule.tietFrom||""} onChange={e=>handleTietFrom(e.target.value)} style={inp}>
            <option value="">--</option>
            {TIET_START.map(t => <option key={t.tiet} value={String(t.tiet)}>Tiết {t.tiet} ({t.time})</option>)}
          </select>
        </div>
        <div>
          <span style={lbl}>Đến tiết</span>
          <select value={rule.tietTo||""} onChange={e=>handleTietTo(e.target.value)} style={inp}>
            <option value="">--</option>
            {TIET_START.filter(t=>!rule.tietFrom||t.tiet>=parseInt(rule.tietFrom)).map(t =>
              <option key={t.tiet} value={String(t.tiet)}>Tiết {t.tiet}</option>)}
          </select>
        </div>
        <div>
          <span style={lbl}>Giờ bắt đầu</span>
          <input type="time" value={rule.startTime||""} onChange={e=>upd("startTime",e.target.value)} style={inp} />
        </div>
        <div>
          <span style={lbl}>Giờ kết thúc</span>
          <input type="time" value={rule.endTime||""} onChange={e=>upd("endTime",e.target.value)} style={inp} />
        </div>
      </div>

      {/* Ghi chú + tags + xóa */}
      <div style={{ display:"flex", gap:8, alignItems:"flex-end" }}>
        <div style={{ flex:1 }}>
          <span style={lbl}>Ghi chú</span>
          <input value={rule.note||""} onChange={e=>upd("note",e.target.value)}
            placeholder="Ghi chú thêm..." style={inp} />
        </div>
        <div style={{ display:"flex", alignItems:"center", gap:5, flexShrink:0, paddingBottom:2 }}>
          <span style={{ fontSize:13, fontWeight:700, background:buoi.bg,
            color:buoi.color, border:`1px solid ${buoi.border}`, borderRadius:20,
            padding:"3px 8px", whiteSpace:"nowrap" }}>{buoi.label}</span>
          <span style={{ fontSize:13, fontWeight:700, background:loai.bg,
            color:loai.color, borderRadius:20, padding:"3px 8px", whiteSpace:"nowrap" }}>{loai.label}</span>
        </div>
        <button onClick={onDelete} style={{ background:"none", border:"1px solid #fee2e2",
          borderRadius:8, color:"#ef4444", padding: isMobile?"10px 12px":"7px 10px",
          cursor:"pointer", display:"flex", alignItems:"center", flexShrink:0,
          minHeight: isMobile?44:"auto" }}>{IC.trash}</button>
      </div>
    </div>
  );
}

function LichHocSubjectCard({ subject, theme, isMobile, onUpdate, onDelete, semesterStart }) {
  const { accent, accentLight, accentText, dot } = theme;
  const [open, setOpen] = useState(false);
  const [activeTab, setActiveTab] = useState("rules"); // "rules" | "specific"
  const [showPreview, setShowPreview] = useState(false);
  const [previewYear, setPreviewYear] = useState(() => new Date().getFullYear());
  const [previewMonth, setPreviewMonth] = useState(() => new Date().getMonth());
  // Form thêm lịch cụ thể
  const [addingSpec, setAddingSpec] = useState(false);
  const [specForm, setSpecForm] = useState({ date:"", buoi:"sang", loai:"lt", tietFrom:"", tietTo:"", startTime:"", endTime:"", room:"", note:"" });

  const rules = subject.rules || [];
  const specifics = subject.specifics || [];

  const addRule = () => onUpdate({ ...subject, rules: [...rules, {
    id: uid(), dayOfWeek: 1, weekPattern: "all", buoi: "sang",
    loai: "lt", room: "", startTime: "", endTime: "", tietFrom:"", tietTo:"", weekFrom:"", weekTo:"", note: ""
  }]});
  const updateRule = (id, r) => onUpdate({ ...subject, rules: rules.map(x => x.id===id ? r : x) });
  const deleteRule = (id) => onUpdate({ ...subject, rules: rules.filter(x => x.id!==id) });

  const addSpecific = () => {
    if (!specForm.date) return;
    onUpdate({ ...subject, specifics: [...specifics, { id: uid(), ...specForm }] });
    setSpecForm({ date:"", buoi:"sang", loai:"lt", tietFrom:"", tietTo:"", startTime:"", endTime:"", room:"", note:"" });
    setAddingSpec(false);
  };
  const deleteSpecific = (id) => onUpdate({ ...subject, specifics: specifics.filter(x => x.id!==id) });

  const inp = { background:"#fff", border:"1px solid #e5e7eb", borderRadius:7, color:"#374151",
    fontSize: isMobile?14:13, padding: isMobile?"9px 10px":"6px 10px", outline:"none",
    fontFamily:"inherit", width:"100%", cursor:"pointer" };
  const lbl = { fontSize:13, fontWeight:700, color:"#9ca3af", letterSpacing:".05em",
    textTransform:"uppercase", marginBottom:4, display:"block" };
  const updSpec = (k,v) => setSpecForm(f=>({...f,[k]:v}));
  const handleSpecTietFrom = (val) => {
    const tf = val ? parseInt(val) : null;
    const tt = specForm.tietTo ? parseInt(specForm.tietTo) : null;
    const safeTo = tt && tf && tt >= tf ? tt : tf;
    const s = tf ? TIET_START.find(t=>t.tiet===tf) : null;
    const e = safeTo ? tietEndTime(safeTo) : "";
    setSpecForm(f=>({...f, tietFrom:val, tietTo:safeTo?String(safeTo):"", startTime:s?s.time:f.startTime, endTime:e}));
  };
  const handleSpecTietTo = (val) => {
    const e = val ? tietEndTime(parseInt(val)) : "";
    setSpecForm(f=>({...f, tietTo:val, endTime:e}));
  };

  // Preview: generate rule days + specifics in previewMonth
  const allPreviewDays = [];
  if (showPreview) {
    rules.forEach(rule => {
      generateDaysInMonth(rule, previewYear, previewMonth, semesterStart).forEach(dateStr => {
        const d = new Date(dateStr + "T00:00:00");
        const loai = LOAI_OPTIONS.find(l=>l.value===rule.loai)||LOAI_OPTIONS[0];
        const buoi = BUOI_OPTIONS.find(b=>b.value===rule.buoi)||BUOI_OPTIONS[0];
        const wn = semesterStart ? getWeekNumber(dateStr, semesterStart) : null;
        allPreviewDays.push({ dateStr, dayNum:d.getDate(), dow:d.getDay(), loai, buoi, wn,
          tietFrom:rule.tietFrom, tietTo:rule.tietTo, startTime:rule.startTime,
          endTime:rule.endTime, room:rule.room, note:rule.note, isSpecific:false });
      });
    });
    specifics.forEach(sp => {
      if (!sp.date) return;
      const d = new Date(sp.date + "T00:00:00");
      if (d.getFullYear()!==previewYear || d.getMonth()!==previewMonth) return;
      const loai = LOAI_OPTIONS.find(l=>l.value===sp.loai)||LOAI_OPTIONS[0];
      const buoi = BUOI_OPTIONS.find(b=>b.value===sp.buoi)||BUOI_OPTIONS[0];
      const wn = semesterStart ? getWeekNumber(sp.date, semesterStart) : null;
      allPreviewDays.push({ dateStr:sp.date, dayNum:d.getDate(), dow:d.getDay(), loai, buoi, wn,
        tietFrom:sp.tietFrom, tietTo:sp.tietTo, startTime:sp.startTime,
        endTime:sp.endTime, room:sp.room, note:sp.note, isSpecific:true });
    });
    allPreviewDays.sort((a,b)=>a.dateStr.localeCompare(b.dateStr));
  }

  const prevPM = () => { if(previewMonth===0){setPreviewMonth(11);setPreviewYear(y=>y-1);}else setPreviewMonth(m=>m-1); };
  const nextPM = () => { if(previewMonth===11){setPreviewMonth(0);setPreviewYear(y=>y+1);}else setPreviewMonth(m=>m+1); };

  const hasAny = rules.length > 0 || specifics.length > 0;

  return (
    <div style={{ background:"#fff", border:"1px solid #e5e7eb", borderRadius: isMobile?14:12,

          <button onClick={onDelete} style={{ color:"#e5e7eb", background:"none", border:"none",

      {open && (

/* ─── HomNayPage ─── */
function HomNayPage({ theme, isMobile, lichHocData, examSubjects, soanBaiData, todos, setTodos }) {
  const { accent, accentLight, accentText } = theme;
  const now = new Date();
  const todayStr = toDateKey(now);
  const dayName = DAYS_VN_FULL[now.getDay()];
  const dateStr = `${now.getDate()} tháng ${now.getMonth()+1}, ${now.getFullYear()}`;

  // ── Build today's sessions (same logic as LichHocMonthView) ──
  const sessions = [];
  const semStart = (lichHocData||{}).semesterStart || "";
  const year = now.getFullYear(), month = now.getMonth();
  const DOW_MAP_VN = {"Thứ 2":1,"Thứ 3":2,"Thứ 4":3,"Thứ 5":4,"Thứ 6":5,"Thứ 7":6,"Chủ Nhật":0};

  // Lịch học (quy luật)
  ((lichHocData||{}).subjects || []).forEach(subj => {
    (subj.rules || []).forEach(rule => {
      if (generateDaysInMonth(rule, year, month, semStart).includes(todayStr)) {
        const loai = LOAI_OPTIONS.find(l=>l.value===rule.loai)||LOAI_OPTIONS[0];
        const buoi = BUOI_OPTIONS.find(b=>b.value===rule.buoi)||BUOI_OPTIONS[0];
        sessions.push({ type:"hoc", subjName:subj.name, rule, loai, buoi, isSpecific:false });
      }
    });
    // Lịch học (cụ thể)
    (subj.specifics || []).forEach(sp => {
      if (sp.date === todayStr) {
        const loai = LOAI_OPTIONS.find(l=>l.value===sp.loai)||LOAI_OPTIONS[0];
        const buoi = BUOI_OPTIONS.find(b=>b.value===sp.buoi)||BUOI_OPTIONS[0];
        sessions.push({ type:"hoc", subjName:subj.name, rule:sp, loai, buoi, isSpecific:true });
      }
    });
  });

  // Lịch thi
  (examSubjects || []).forEach(subj => {
    if (subj.examDate === todayStr)
      sessions.push({ type:"thi", subjName:subj.name, examDate:subj.examDate, examTime:subj.examTime, examRoom:subj.examRoom });
  });

  // Lịch dạy
  ((soanBaiData||{}).subjects || []).forEach(subj => {
    (subj.scheduleRows || []).forEach(row => {
      if (!row.day) return;
      const targetDow = DOW_MAP_VN[row.day];
      if (targetDow !== undefined && now.getDay() === targetDow)
        sessions.push({ type:"day", subjName:subj.name, row });
    });
  });

  // ── Group by buoi ──
  const getBuoi = (s) => {
    if (s.type === "hoc") return s.buoi?.value || "sang";
    if (s.type === "thi") {
      if (!s.examTime) return "sang";
      const h = parseInt((s.examTime||"").split(":")[0], 10);
      return h >= 17 ? "toi" : h >= 12 ? "chieu" : "sang";
    }
    if (s.type === "day") {
      const h = parseInt((s.row?.startTime||"").split(":")[0], 10);
      if (isNaN(h)) return "sang";
      return h >= 17 ? "toi" : h >= 12 ? "chieu" : "sang";
    }
    return "sang";
  };

  // ── Helper: get sort time (minutes from midnight) ──
  const getSortTime = (s) => {
    if (s.type === "hoc") {
      const rule = s.rule || {};
      if (rule.startTime) { const [h,m] = rule.startTime.split(":").map(Number); return h*60+m; }
      if (rule.tietFrom) { const t = TIET_START.find(t=>t.tiet===parseInt(rule.tietFrom)); if(t){const[h,m]=t.time.split(":").map(Number);return h*60+m;} }
      const bv = s.buoi?.value||"sang"; return bv==="sang"?7*60:bv==="chieu"?13*60+30:17*60+30;
    }
    if (s.type === "thi") { if (s.examTime){const[h,m]=s.examTime.split(":").map(Number);return h*60+m;} return 7*60; }
    if (s.type === "day") { if (s.row?.startTime){const[h,m]=s.row.startTime.split(":").map(Number);return h*60+m;} return 7*60; }
    return 0;
  };

  const BUOI_CONFIG = [

    { value:"toi",   label:"Tối",   emoji:"🌙", time:"17:30 – 21:00", color:"#2563eb", bg:"#eff6ff", border:"#93c5fd" },
  ];

  const grouped = { sang: [], chieu: [], toi: [] };

              </button>
            </div>

            {/* Todo list */}
            {sorted.length === 0 ? (
              <div style={{ background:"#fafafa", border:"1px dashed #f0f0f0", borderRadius:10,
                padding:"12px 14px", fontSize:13, color:"#d1d5db", fontWeight:500 }}>Trống</div>
            ) : (
              <div style={{ display:"flex", flexDirection:"column", gap:7 }}>
                {[...activeTodos, ...doneTodos].map(todo => (
                  <div key={todo.id} style={{ display:"flex", alignItems:"center", gap:9,
                    background: todo.done ? "#fafafa" : "#fff",
                    border:`1.5px solid ${todo.done ? "#f0f0f0" : "#e5e7eb"}`,
                    borderRadius:11, padding:isMobile?"10px 11px":"8px 11px",
                    opacity: todo.done ? 0.65 : 1, transition:"all .15s" }}>

                    <button onClick={() => toggleDone(todo.id)} style={{
                      width:20, height:20, borderRadius:5, border:`2px solid ${todo.done ? accent : "#d1d5db"}`,
                      background: todo.done ? accent : "transparent", flexShrink:0, cursor:"pointer",
                      display:"flex", alignItems:"center", justifyContent:"center", transition:"all .15s", padding:0 }}>
                      {todo.done && <svg width="10" height="10" viewBox="0 0 12 12" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="2,6 5,9 10,3"/></svg>}
                    </button>

                    <span style={{ flex:1, fontSize:isMobile?14:13, color: todo.done?"#9ca3af":"#111827",
                      textDecoration: todo.done?"line-through":"none", fontWeight:500,
                      lineHeight:1.4, wordBreak:"break-word", transition:"all .15s" }}>
                      {todo.text}
                    </span>

                    {todo.time && (
                      <span style={{ fontSize:11, fontWeight:600, color: todo.done?"#d1d5db":accent,
                        background: todo.done?"#f3f4f6":accentLight, borderRadius:5, padding:"2px 7px",
                        flexShrink:0, whiteSpace:"nowrap" }}>⏰ {todo.time}</span>
                    )}

                    <button onClick={() => deleteTodo(todo.id)} style={{
                      background:"#f9fafb", border:"1.5px solid #e5e7eb", cursor:"pointer", color:"#9ca3af",
                      display:"flex", alignItems:"center", justifyContent:"center",
                      width:28, height:28, borderRadius:7, flexShrink:0, transition:"all .12s" }}
                      onMouseEnter={e=>{ e.currentTarget.style.background="#fef2f2"; e.currentTarget.style.borderColor="#fecaca"; e.currentTarget.style.color="#ef4444"; }}
                      onMouseLeave={e=>{ e.currentTarget.style.background="#f9fafb"; e.currentTarget.style.borderColor="#e5e7eb"; e.currentTarget.style.color="#9ca3af"; }}>
                      <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/>
                        <path d="M9 6V4h6v2"/>
                      </svg>
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })()}
    </div>
  );
}
function LichHocMonthView({ lichHocData, theme, isMobile, examSubjects, soanBaiData, onLichHocChange }) {
  const { accent, accentLight, accentText } = theme;
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [selectedDay, setSelectedDay] = useState(null);
  const [activeFilter, setActiveFilter] = useState(null); // null | "lt" | "th" | "thi" | "day"
  const toggleFilter = (f) => { setActiveFilter(v => v === f ? null : f); setSelectedDay(null); };

  // ── Reminder state ──
  const [reminderText, setReminderText] = React.useState("");
  const [reminderTime, setReminderTime] = React.useState("");
  const reminderInputRef = React.useRef(null);

  const reminders = lichHocData.reminders || [];

  const openReminderAdd = (dateStr) => {
    setReminderText("");
    setReminderTime("");
    setTimeout(() => reminderInputRef.current?.focus(), 80);
  };
  const submitReminder = (dateStr) => {
    const text = reminderText.trim();
    if (!text) return;
    const newR = { id: uid(), date: dateStr, text, time: reminderTime||null, createdAt: Date.now() };
    onLichHocChange(d => ({ ...d, reminders: [...(d.reminders||[]), newR] }));
    setReminderText(""); setReminderTime("");
    reminderInputRef.current?.focus();
  };
  const deleteReminder = (id) => {
    onLichHocChange(d => ({ ...d, reminders: (d.reminders||[]).filter(r => r.id !== id) }));
  };
  const toggleReminderDone = (id) => {
    onLichHocChange(d => ({ ...d, reminders: (d.reminders||[]).map(r => r.id===id ? {...r, done:!r.done} : r) }));
  };

  // Count reminders per date (undone)
  const remindersByDate = React.useMemo(() => {
    const map = {};
    reminders.forEach(r => { if (r.date) { map[r.date] = (map[r.date]||0) + (r.done?0:1); } });
    return map;
  }, [reminders]);

  const prevM = () => { if(month===0){setMonth(11);setYear(y=>y-1);}else setMonth(m=>m-1); };
  const nextM = () => { if(month===11){setMonth(0);setYear(y=>y+1);}else setMonth(m=>m+1); };

  const semStart = lichHocData.semesterStart || "";
  // Build map: dateStr -> list of events (lịch học + lịch thi + lịch dạy)
  const sessionMap = {};
  const addToMap = (dateStr, item) => {
    if (!sessionMap[dateStr]) sessionMap[dateStr] = [];
    sessionMap[dateStr].push(item);
  };

  // Lịch học (quy luật + cụ thể)
  (lichHocData.subjects || []).forEach(subj => {
    (subj.rules || []).forEach(rule => {
      generateDaysInMonth(rule, year, month, semStart).forEach(dateStr => {
        const loai = LOAI_OPTIONS.find(l=>l.value===rule.loai)||LOAI_OPTIONS[0];
        const buoi = BUOI_OPTIONS.find(b=>b.value===rule.buoi)||BUOI_OPTIONS[0];
        addToMap(dateStr, { type:"hoc", subjName: subj.name, rule, loai, buoi, isSpecific:false });
      });
    });
    (subj.specifics || []).forEach(sp => {
      if (!sp.date) return;
      const d = new Date(sp.date+"T00:00:00");
      if (d.getFullYear()!==year || d.getMonth()!==month) return;
      const loai = LOAI_OPTIONS.find(l=>l.value===sp.loai)||LOAI_OPTIONS[0];
      const buoi = BUOI_OPTIONS.find(b=>b.value===sp.buoi)||BUOI_OPTIONS[0];
      addToMap(sp.date, { type:"hoc", subjName: subj.name, rule: sp, loai, buoi, isSpecific:true });
    });
  });

  // Lịch thi (từ Môn học - examDate)
  const DOW_MAP_VN = {"Thứ 2":1,"Thứ 3":2,"Thứ 4":3,"Thứ 5":4,"Thứ 6":5,"Thứ 7":6,"Chủ Nhật":0};
  (examSubjects || []).forEach(subj => {
    if (!subj.examDate) return;
    const d = new Date(subj.examDate+"T00:00:00");
    if (d.getFullYear()===year && d.getMonth()===month) {
      addToMap(subj.examDate, { type:"thi", subjName: subj.name, examDate: subj.examDate });
    }
  });

  // Lịch dạy (từ Lớp dạy - scheduleRows, mỗi tuần)
  const lastDayOfMonth = new Date(year, month + 1, 0).getDate();
  (soanBaiData?.subjects || []).forEach(subj => {
    (subj.scheduleRows || []).forEach(row => {
      if (!row.day) return;
      const targetDow = DOW_MAP_VN[row.day];
      if (targetDow === undefined) return;
      for (let d = 1; d <= lastDayOfMonth; d++) {
        const date = new Date(year, month, d);
        if (date.getDay() !== targetDow) continue;
        const dateStr = toDateKey(date);
        addToMap(dateStr, { type:"day", subjName: subj.name, row });
      }
    });
  });

  // Lịch cần nhớ (reminders)
  reminders.forEach(r => {
    if (!r.date) return;
    const d = new Date(r.date+"T00:00:00");
    if (d.getFullYear()===year && d.getMonth()===month) {
      addToMap(r.date, { type:"reminder", reminder: r });
    }
  });

  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  let startDow = firstDay.getDay() - 1; if (startDow < 0) startDow = 6;
  const weeks = Math.ceil((startDow + lastDay.getDate()) / 7);
  const cells = [];
  for (let i = 0; i < weeks * 7; i++) {
    const dayNum = i - startDow + 1;
    if (dayNum < 1 || dayNum > lastDay.getDate()) { cells.push(null); continue; }
    const d = new Date(year, month, dayNum);
    const key = toDateKey(d);
    const isToday = key === today();
    const sessions = sessionMap[key] || [];
    cells.push({ dayNum, key, isToday, sessions, dow: d.getDay() });
  }

  const DAY_HEADERS = ["T2","T3","T4","T5","T6","T7","CN"];
  const selectedSessions = selectedDay ? (sessionMap[selectedDay] || []) : [];
  const selDate = selectedDay ? new Date(selectedDay + "T00:00:00") : null;

  return (
    <div>
      {/* Month nav */}
      <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:14 }}>
        <button onClick={prevM} style={{ background:"none", border:"1px solid #e5e7eb",
          borderRadius:9, padding: isMobile?"10px 12px":"7px 10px", cursor:"pointer",
          color:"#6b7280", display:"flex", alignItems:"center", minHeight: isMobile?44:"auto" }}>
          {IC.arrowLeft}
        </button>
        <div style={{ textAlign:"center" }}>
          <div style={{ fontSize: isMobile?17:16, fontWeight:800, color:"#111827" }}>
            {MONTHS_VN[month]} {year}
          </div>
          {semStart && (
            <div style={{ fontSize:13, color:"#9ca3af", marginTop:2 }}>
              Đầu HK: {semStart.split("-").reverse().join("/")}
            </div>
          )}
        </div>
        <button onClick={nextM} style={{ background:"none", border:"1px solid #e5e7eb",
          borderRadius:9, padding: isMobile?"10px 12px":"7px 10px", cursor:"pointer",
          color:"#6b7280", display:"flex", alignItems:"center", minHeight: isMobile?44:"auto" }}>
          {IC.arrowRight}
        </button>
      </div>

      {/* Grid */}
      <div style={{ background:"#fff", borderRadius: isMobile?14:12, border:"1px solid #e5e7eb",
        overflow:"hidden", boxShadow:"0 1px 8px rgba(0,0,0,.05)" }}>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)",
          borderBottom:`2px solid ${accent}`, background:accentLight }}>
          {DAY_HEADERS.map((h,i) => (
            <div key={h} style={{ textAlign:"center", padding: isMobile?"8px 2px":"8px 2px",
              fontSize:13, fontWeight:700, letterSpacing:".06em",
              color: i===6?"#dc2626":accentText }}>{h}</div>
          ))}
        </div>
        {Array.from({length:weeks}).map((_,wi) => {
          // Check if any cell in this week row is today
          const weekCells = cells.slice(wi*7, wi*7+7).filter(Boolean);
          const isCurrentWeek = weekCells.some(c => c.isToday);
          return (
          <div key={wi} style={{ display:"grid", gridTemplateColumns:"repeat(7,1fr)",
            borderBottom: wi<weeks-1?"1px solid #f3f4f6":"none",
            boxShadow: isCurrentWeek ? `inset 2px 0 0 ${accent}, inset -2px 0 0 ${accent}, inset 0 2px 0 ${accent}, inset 0 -2px 0 ${accent}` : "none",
            background: isCurrentWeek ? `${accent}07` : "transparent",
            transition:"background .2s" }}>
            {cells.slice(wi*7, wi*7+7).map((cell, ci) => {
              if (!cell) return <div key={ci} style={{ minHeight: isMobile?52:56 }} />;
              const isSel = cell.key === selectedDay;
              const isSun = cell.dow === 0;
              // Filter logic: does this cell match the active filter?
              const cellMatchesFilter = activeFilter === null ? true : (() => {
                if (activeFilter === "thi") return cell.sessions.some(s => s.type === "thi");
                if (activeFilter === "day") return cell.sessions.some(s => s.type === "day");
                if (activeFilter === "lt") return cell.sessions.some(s => s.type === "hoc" && s.loai?.value === "lt");
                if (activeFilter === "th") return cell.sessions.some(s => s.type === "hoc" && s.loai?.value !== "lt");
                if (activeFilter === "reminder") return cell.sessions.some(s => s.type === "reminder");
                return true;
              })();
              const isDimmed = activeFilter !== null && !cellMatchesFilter;
              const isHighlighted = activeFilter !== null && cellMatchesFilter && cell.sessions.length > 0;
              return (
                <button key={ci} onClick={() => { if (!isDimmed) { const wasSel = isSel; setSelectedDay(isSel ? null : cell.key); if (!wasSel) openReminderAdd(cell.key); } }}
                  style={{ minHeight: isMobile?64:66, border:"none", position:"relative",
                    background: isSel ? accentLight : isHighlighted ? `${accent}12` : "transparent",
                    cursor: isDimmed ? "default" : "pointer", display:"flex", flexDirection:"column",
                    alignItems:"center", padding:"4px 2px",
                    borderLeft: ci>0?"1px solid #f9fafb":"none",
                    opacity: isDimmed ? 0.28 : 1,
                    transition:"background .15s, opacity .2s",
                    boxShadow: isHighlighted ? `inset 0 0 0 1.5px ${accent}30` : "none" }}
                  onMouseEnter={e=>{ if(!isSel&&!cell.isToday&&!isDimmed) e.currentTarget.style.background=`${accent}18`; }}
                  onMouseLeave={e=>{ if(!isSel&&!cell.isToday) e.currentTarget.style.background=isHighlighted?`${accent}12`:"transparent"; }}
                >
                  <div style={{ width: isMobile?28:26, height: isMobile?28:26, borderRadius:"50%",
                    display:"flex", alignItems:"center", justifyContent:"center",
                    background: cell.isToday ? accent : isHighlighted ? `${accent}22` : "transparent",
                    fontSize: isMobile?13:12, fontWeight: (cell.isToday||isHighlighted)?800:600,
                    color: cell.isToday?"#fff" : isSun?"#dc2626":isHighlighted?accentText:"#111827" }}>
                    {cell.dayNum}
                  </div>
                  {/* Reminder badge */}
                  {remindersByDate[cell.key] > 0 && (
                    <div style={{ position:"absolute", top:3, right:3,
                      background:"#f59e0b", color:"#fff", borderRadius:99,
                      fontSize:9, fontWeight:800, minWidth:14, height:14,

                  {/* Sáng / Chiều / Tối bars */}
                  {(() => {
                    const hasSang = cell.sessions.some(s => {
                      if (s.type === "hoc") return (s.buoi?.value || s.rule?.buoi) === "sang";
                      if (s.type === "thi") return true; // thi thường buổi sáng, hiện ở sang
                      if (s.type === "day") {
                        const st = s.row?.startTime || "";
                        if (!st) return true; // không rõ giờ → show sáng
                        const h = parseInt(st.split(":")[0], 10);
                        return h < 12;
                      }
                      return false;
                    });
                    const hasChieu = cell.sessions.some(s => {
                      if (s.type === "hoc") return (s.buoi?.value || s.rule?.buoi) === "chieu";
                      if (s.type === "thi") return false;
                      if (s.type === "day") {
                        const st = s.row?.startTime || "";
                        if (!st) return false;
                        const h = parseInt(st.split(":")[0], 10);
                        return h >= 12 && h < 17;
                      }
                      return false;
                    });
                    const hasToi = cell.sessions.some(s => {
                      if (s.type === "hoc") return (s.buoi?.value || s.rule?.buoi) === "toi";
                      if (s.type === "thi") return false;
                      if (s.type === "day") {
                        const st = s.row?.startTime || "";
                        if (!st) return false;
                        const h = parseInt(st.split(":")[0], 10);
                        return h >= 17;
                      }
                      return false;
                    });
                    const anySession = hasSang || hasChieu || hasToi;
                    return (
                      <div style={{ display:"flex", gap:2, marginTop:4, width: isMobile?32:28, justifyContent:"center" }}>

                          { active: hasSang,  color: "#f97316", title: "Sáng" },

                            background: b.active ? b.color : "#e5e7eb",
                            opacity: b.active ? 1 : 0.35,
                            transition:"background .15s",

        </div>
      )}
      <div style={{ marginTop:8, display:"flex", gap:8, flexWrap:"wrap", justifyContent:"center" }}>
        {[
          { key:"lt",  label:"Lý thuyết", color:"#5c6bc0", bg:"#e8eaf6", border:"#c5cae9",
            icon:<svg width="15" height="15" fill="none" stroke="#5c6bc0" strokeWidth="2" viewBox="0 0 24 24"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg> },
          { key:"th",  label:"Thực hành", color:"#0891b2", bg:"#e0f2fe", border:"#bae6fd",
            icon:<svg width="15" height="15" fill="none" stroke="#0891b2" strokeWidth="2" viewBox="0 0 24 24"><path d="M9 3h6v7l3 9H6l3-9V3z"/><line x1="6" y1="3" x2="18" y2="3"/></svg> },
          { key:"thi", label:"Lịch thi",  color:"#dc2626", bg:"#fef2f2", border:"#fecaca",
            icon:<svg width="15" height="15" fill="none" stroke="#dc2626" strokeWidth="2" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg> },
          { key:"day", label:"Lịch dạy",  color:"#a855f7", bg:"#faf5ff", border:"#e9d5ff",
            icon:<svg width="15" height="15" fill="#a855f7" stroke="#a855f7" strokeWidth="1.5" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3" fill="#fff" stroke="#fff"/></svg> },
        ].map(({ key, label, color, bg, border, icon }) => {

          return (
            <button key={key} onClick={() => toggleFilter(key)} style={{
              display:"flex", alignItems:"center", gap:5,
              fontSize:13, fontWeight:700, color,
              background: isActive ? color : bg,
              color: isActive ? "#fff" : color,
              borderRadius:20, padding:"5px 12px",
              border: `1.5px solid ${isActive ? color : border}`,
              cursor:"pointer", transition:"all .15s",
              boxShadow: isActive ? `0 2px 8px ${color}44` : "none",

            }}>

        })}
        {/* Lịch cần nhớ */}
        <button onClick={() => toggleFilter("reminder")} style={{
          display:"flex", alignItems:"center", gap:5,

          color: activeFilter==="reminder" ? "#fff" : "#92400e",

          border: `1.5px solid ${activeFilter==="reminder" ? "#f59e0b" : "#fde68a"}`,

          boxShadow: activeFilter==="reminder" ? "0 2px 8px #f59e0b44" : "none",
          transform: activeFilter==="reminder" ? "scale(1.06)" : "scale(1)"
        }}>
          <svg width="15" height="15" fill="none" stroke={activeFilter==="reminder"?"#fff":"#d97706"} strokeWidth="2" viewBox="0 0 24 24">

            <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>

          Hôm nay
        </div>
      </div>

      {/* Selected day detail */}
      {selectedDay && (
        <div style={{ marginTop:14, background:"#fff", border:`1.5px solid ${accent}44`,
          borderRadius:12, padding: isMobile?"14px 16px":"12px 16px",
          boxShadow:"0 2px 12px rgba(0,0,0,.06)" }}>
          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
            <div style={{ fontSize:16, fontWeight:800, color:"#111827" }}>
              📅 {DAYS_VN_FULL[selDate.getDay()]}, {selDate.getDate()} tháng {selDate.getMonth()+1}
              {semStart && (() => {

            <button onClick={()=>{ setSelectedDay(null); }} style={{ background:"#f3f4f6", border:"none",
              borderRadius:8, padding:"6px 8px", cursor:"pointer", color:"#6b7280",

          </div>

          {/* ── Lịch cần nhớ ── */}
          <div style={{ marginBottom:12, background:"#fffbeb", borderRadius:10, padding:"10px 12px",
            border:"1.5px solid #fde68a" }}>

              display:"flex", alignItems:"center", gap:5 }}>
              <svg width="13" height="13" fill="none" stroke="#d97706" strokeWidth="2.2" viewBox="0 0 24 24">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              Lịch cần nhớ
            </div>
            {/* Reminders đã có */}
            {reminders.filter(r=>r.date===selectedDay).length > 0 && (
              <div style={{ display:"flex", flexDirection:"column", gap:5, marginBottom:8 }}>
                {reminders.filter(r=>r.date===selectedDay).sort((a,b)=>(a.time||"").localeCompare(b.time||"")).map(r => (
                  <div key={r.id} style={{ display:"flex", alignItems:"center", gap:7,
                    background:"#fff", borderRadius:8, padding:"7px 10px",
                    border:"1px solid #fde68a",
                    opacity: r.done ? 0.65 : 1 }}>
                    <button onClick={()=>toggleReminderDone(r.id)}
                      style={{ width:18, height:18, borderRadius:5, flexShrink:0, cursor:"pointer",
                        border:`2px solid ${r.done?"#22c55e":"#fcd34d"}`,
                        background:r.done?"#22c55e":"transparent", padding:0,
                        display:"flex", alignItems:"center", justifyContent:"center" }}>
                      {r.done&&<svg width="9" height="9" viewBox="0 0 12 12" fill="none" stroke="#fff" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="2,6 5,9 10,3"/></svg>}
                    </button>
                    {r.time && (
                      <span style={{ fontSize:11.5, fontWeight:700, color:"#d97706",
                        background:"#fef3c7", borderRadius:5, padding:"2px 6px",
                        flexShrink:0, whiteSpace:"nowrap", border:"1px solid #fde68a" }}>⏰ {r.time}</span>
                    )}
                    <span style={{ flex:1, fontSize:13, color:r.done?"#9ca3af":"#111827",
                      textDecoration:r.done?"line-through":"none", fontWeight:500,
                      lineHeight:1.4, wordBreak:"break-word" }}>{r.text}</span>
                    <button onClick={()=>deleteReminder(r.id)}
                      style={{ background:"none", border:"none", cursor:"pointer", color:"#d1d5db",
                        padding:0, display:"flex", alignItems:"center", flexShrink:0 }}
                      onMouseEnter={e=>e.currentTarget.style.color="#ef4444"}
                      onMouseLeave={e=>e.currentTarget.style.color="#d1d5db"}>
                      <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24">
                        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
                      </svg>
                    </button>
                  </div>
                ))}
              </div>
            )}
            {/* Form thêm */}
            <div style={{ display:"flex", gap:7, alignItems:"stretch" }}>
              <input ref={reminderInputRef} value={reminderText} onChange={e=>setReminderText(e.target.value)}
                onKeyDown={e=>{ if(e.key==="Enter") submitReminder(selectedDay); }}
                placeholder="Thêm lịch cần nhớ..."
                style={{ flex:1, border:"1.5px solid #fde68a", borderRadius:9,
                  padding:isMobile?"10px 11px":"8px 11px", fontSize:isMobile?15:13.5,
                  fontFamily:"inherit", outline:"none", color:"#111827", background:"#fff",
                  transition:"border-color .15s" }}
                onFocus={e=>e.target.style.borderColor="#f59e0b"}
                onBlur={e=>e.target.style.borderColor="#fde68a"}
              />
              <input type="time" value={reminderTime} onChange={e=>setReminderTime(e.target.value)}
                style={{ border:"1.5px solid #fde68a", borderRadius:9, padding:"0 9px",
                  fontSize:isMobile?14:13, fontFamily:"inherit", outline:"none",
                  color: reminderTime?"#111827":"#9ca3af", background:"#fff",
                  transition:"border-color .15s", flexShrink:0, cursor:"pointer", width:isMobile?105:96 }}
                onFocus={e=>e.target.style.borderColor="#f59e0b"}
                onBlur={e=>e.target.style.borderColor="#fde68a"}
              />
              <button onClick={()=>submitReminder(selectedDay)} style={{
                background:"#f59e0b", border:"none", borderRadius:9,
                color:"#fff", padding:"0 13px", cursor:"pointer", flexShrink:0,
                display:"flex", alignItems:"center", justifyContent:"center",
                boxShadow:"0 2px 6px #f59e0b55" }}>
                <svg width="15" height="15" viewBox="0 0 14 14" fill="none" stroke="currentColor" strokeWidth="2.4" strokeLinecap="round">
                  <line x1="7" y1="2" x2="7" y2="12"/><line x1="2" y1="7" x2="12" y2="7"/>
                </svg>
              </button>
            </div>
          </div>

          {selectedSessions.filter(s=>s.type!=="reminder").length === 0 ? (
            <div style={{ fontSize:15, color:"#d1d5db", textAlign:"center", padding:"6px 0" }}>
              Không có sự kiện nào
            </div>
          ) : (
            <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
              {selectedSessions.filter(s=>s.type!=="reminder").map((s, i) => {
                if (s.type === "thi") {
                  const dl = daysLeft(s.examDate);
                  const dlColor = dl < 0 ? "#9ca3af" : dl <= 3 ? "#dc2626" : dl <= 7 ? "#f59e0b" : "#16a34a";
                  return (
                    <div key={i} style={{ display:"flex", alignItems:"center", gap:10,
                      background:"#fef2f2", border:"1px solid #fecaca",
                      borderRadius:10, padding: isMobile?"10px 12px":"8px 12px" }}>
                      <span style={{ fontSize:22, flexShrink:0 }}>🔔</span>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize: isMobile?14:13, fontWeight:700, color:"#111827", marginBottom:3 }}>{s.subjName}</div>
                        <div style={{ display:"flex", gap:6, alignItems:"center", flexWrap:"wrap" }}>
                          <span style={{ fontSize:13, fontWeight:700, background:"#dc2626", color:"#fff", borderRadius:20, padding:"2px 9px" }}>Lịch thi</span>
                          <span style={{ fontSize:13, fontWeight:700, color:dlColor }}>
                            {dl < 0 ? "Đã thi" : dl === 0 ? "Hôm nay!" : `Còn ${dl} ngày`}
                          </span>
                        </div>
                      </div>
                    </div>
                  );
                }
                if (s.type === "day") {
                  const row = s.row || {};
                  return (
                    <div key={i} style={{ display:"flex", alignItems:"center", gap:10,
                      background:"#faf5ff", border:"1px solid #e9d5ff",
                      borderRadius:10, padding: isMobile?"10px 12px":"8px 12px" }}>
                      <span style={{ fontSize:22, flexShrink:0 }}>✏️</span>
                      <div style={{ flex:1, minWidth:0 }}>
                        <div style={{ fontSize: isMobile?14:13, fontWeight:700, color:"#111827", marginBottom:3 }}>{s.subjName}</div>
                        <div style={{ display:"flex", gap:6, alignItems:"center", flexWrap:"wrap" }}>
                          <span style={{ fontSize:13, fontWeight:700, background:"#a855f7", color:"#fff", borderRadius:20, padding:"2px 9px" }}>Lịch dạy</span>
                          {row.startTime && row.endTime && <span style={{ fontSize:13, color:"#7c3aed" }}>{row.startTime} – {row.endTime}</span>}
                          {row.room && <span style={{ fontSize:13, color:"#9ca3af" }}>📍 {row.room}</span>}
                          {row.note && <span style={{ fontSize:13, color:"#9ca3af" }}>{row.note}</span>}
                        </div>
                      </div>
                    </div>
                  );
                }
                const buoi = s.buoi || BUOI_OPTIONS.find(b=>b.value===s.rule?.buoi)||BUOI_OPTIONS[0];
                const loai = s.loai || LOAI_OPTIONS.find(l=>l.value===s.rule?.loai)||LOAI_OPTIONS[0];
                return (
                  <div key={i} style={{ display:"flex", alignItems:"center", gap:10,
                    background: buoi.bg, border:`1px solid ${buoi.border}`,
                    borderRadius:10, padding: isMobile?"10px 12px":"8px 12px" }}>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ display:"flex", alignItems:"center", gap:6, marginBottom:3 }}>
                        <span style={{ fontSize: isMobile?14:13, fontWeight:700, color:"#111827" }}>{s.subjName}</span>
                        {s.isSpecific && <span style={{ fontSize:12, fontWeight:800, background:"#fef3c7",
                          color:"#b45309", borderRadius:4, padding:"1px 5px" }}>📌 Cụ thể</span>}
                      </div>
                      <div style={{ display:"flex", gap:5, flexWrap:"wrap" }}>
                        <span style={{ fontSize:13, fontWeight:700, background:loai.bg,
                          color:loai.color, borderRadius:20, padding:"2px 8px" }}>{loai.label}</span>
                        <span style={{ fontSize:13, fontWeight:700, background:"#fff",
                          color:buoi.color, border:`1px solid ${buoi.border}`,
                          borderRadius:20, padding:"2px 8px" }}>{buoi.label}</span>
                        {s.rule?.tietFrom && <span style={{ fontSize:13, color:"#6b7280", alignSelf:"center" }}>
                          Tiết {s.rule.tietFrom}{s.rule.tietTo&&s.rule.tietTo!==s.rule.tietFrom?`-${s.rule.tietTo}`:""}</span>}
                        <span style={{ fontSize:13, color:"#6b7280", alignSelf:"center" }}>
                          {s.rule?.startTime && s.rule?.endTime ? `${s.rule.startTime}–${s.rule.endTime}` : buoi.time}
                        </span>
                      </div>
                      {(s.rule?.room || s.rule?.note) && (
                        <div style={{ fontSize:13, color:"#9ca3af", marginTop:3 }}>
                          {s.rule.room && `📍 ${s.rule.room}`}
                          {s.rule.room && s.rule.note && " · "}
                          {s.rule.note}
                        </div>
                      )}
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ─── CalendarPage → LichHocPage ─── */
function CalendarPage({ theme, isMobile, schedule, onScheduleChange, subjects, soanBaiData, lichHocData, onLichHocChange, todos, setTodos }) {
  // lichHocData is now managed by App for cross-device sync
  const setLichHocData = onLichHocChange;

  const { accent, accentLight, accentText, dot } = theme;
  const [activeSection, setActiveSection] = useState("calendar");
  const [addingSubject, setAddingSubject] = useState(false);
  const [newName, setNewName] = useState("");
  const bottomPad = isMobile ? "calc(24px + env(safe-area-inset-bottom))" : "80px";

  const addSubject = () => {
    if (!newName.trim()) return;
    setLichHocData(d => ({ ...d, subjects: [...(d.subjects||[]),
      { id: uid(), name: newName.trim(), rules: [] }] }));
    setNewName(""); setAddingSubject(false);
  };
  const updateSubject = (id, u) => setLichHocData(d => ({
    ...d, subjects: d.subjects.map(s => s.id===id ? u : s)
  }));
  const deleteSubject = (id) => setLichHocData(d => ({
    ...d, subjects: d.subjects.filter(s => s.id!==id)
  }));

  const lichHocSubjects = lichHocData.subjects || [];
  const semStart = lichHocData.semesterStart || "";

  return (
    <div style={{ maxWidth: isMobile?"100%":720, margin:"0 auto",
      padding: isMobile?`16px 16px ${bottomPad}`:"24px 28px 80px" }}>

      {/* Section tabs */}
      <div style={{ display:"flex", gap:4, marginBottom:16, background:"#fff",
        borderRadius:12, padding:4, border:"1px solid #e5e7eb",
        boxShadow:"0 1px 4px rgba(0,0,0,.04)", overflowX:"auto" }}>
        {[
          ["calendar", IC.calendar, "Lịch tháng"],
          ["manage",   IC.book,     "Quản lý môn"],
          ["lithi",    IC.flag,     "Lịch thi"],
          ["lichdaytong", IC.pen,   "Lịch dạy"],
        ].map(([k, icon, label]) => (
          <button key={k} onClick={()=>setActiveSection(k)} style={{
            flex:1, display:"flex", alignItems:"center", justifyContent:"center", gap:5,
            padding: isMobile?"10px 6px":"8px 8px",
            background: activeSection===k ? accentLight : "transparent",
            border:"none", borderRadius:9, whiteSpace:"nowrap",
            color: activeSection===k ? accentText : "#9ca3af",
            fontSize: isMobile?12:11, fontWeight:700, cursor:"pointer",
            transition:"background .15s, color .15s" }}>
            <span style={{ color: activeSection===k ? accent : "#d1d5db" }}>{icon}</span>
            {label}
          </button>
        ))}
      </div>

      {/* Semester start + current week badge */}
      {(() => {
        const currentWeek = semStart ? getWeekNumber(today(), semStart) : null;
        const isEven = currentWeek && currentWeek % 2 === 0;
        return (
          <div style={{ marginBottom:14 }}>
            {/* Week badge – chỉ hiện khi đã có ngày đầu HK và tuần hợp lệ */}
            {currentWeek && currentWeek > 0 && (
              <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8,
                background: accentLight, border:`1.5px solid ${accent}40`,
                borderRadius:10, padding: isMobile?"12px 16px":"10px 14px" }}>
                <span style={{ fontSize: isMobile?26:22 }}>📅</span>
                <div style={{ flex:1 }}>
                  <div style={{ fontSize: isMobile?18:16, fontWeight:800, color: accentText, lineHeight:1.2 }}>
                    Tuần <span style={{ fontSize: isMobile?26:22, letterSpacing:"-.02em" }}>{currentWeek}</span>
                    <span style={{ fontSize: isMobile?13:12, fontWeight:600,
                      background: isEven ? "#fef3c7" : "#dbeafe",
                      color: isEven ? "#92400e" : "#1e40af",
                      borderRadius:6, padding:"2px 8px", marginLeft:8, verticalAlign:"middle" }}>
                      tuần {isEven ? "chẵn" : "lẻ"}
                    </span>
                  </div>
                  <div style={{ fontSize:12, color: accentText, opacity:.7, marginTop:2 }}>
                    Học kỳ bắt đầu {new Date(semStart+"T00:00:00").toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit",year:"numeric"})}
                  </div>
                </div>
              </div>
            )}
            <div style={{ background:"#fff", border:"1px solid #e5e7eb", borderRadius:10,
              padding: isMobile?"12px 14px":"10px 14px",
              display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
              <span style={{ fontSize:13, fontWeight:700, color:"#9ca3af",
                textTransform:"uppercase", letterSpacing:".06em", flexShrink:0 }}>
                📆 Đầu học kỳ
              </span>
              <input type="date" value={semStart}
                onChange={e => setLichHocData(d => ({ ...d, semesterStart: e.target.value }))}
                style={{ background:"none", border:"none", borderBottom:"1px solid #e5e7eb",
                  color:"#374151", fontSize: isMobile?15:13, outline:"none", cursor:"pointer",
                  minHeight: isMobile?36:"auto" }} />
              <span style={{ fontSize:13, color:"#d1d5db", flex:1 }}>
                {semStart
                  ? (currentWeek && currentWeek > 0
                      ? `→ Hiện tại: tuần ${currentWeek} (tuần ${isEven?"chẵn":"lẻ"})`
                      : "→ Dùng để tính số tuần HK (tuần lẻ/chẵn)")
                  : "Nhập để xem bạn đang ở tuần mấy"}
              </span>
            </div>
          </div>
        );
      })()}

      {activeSection === "calendar" ? (
        <LichHocMonthView lichHocData={lichHocData} theme={theme} isMobile={isMobile} examSubjects={subjects||[]} soanBaiData={soanBaiData||{subjects:[]}} onLichHocChange={onLichHocChange} />
      ) : activeSection === "manage" ? (
        <div>
          {lichHocSubjects.length === 0 && !addingSubject && (
            <div style={{ textAlign:"center", padding:"60px 0", color:"#d1d5db" }}>
              <div style={{ fontSize:46, marginBottom:14 }}>📅</div>
              <div style={{ fontSize: isMobile?15:13, fontWeight:500 }}>Chưa có môn học nào</div>
            </div>
          )}
          {lichHocSubjects.map(s => (
            <LichHocSubjectCard key={s.id} subject={s} theme={theme} isMobile={isMobile}
              semesterStart={semStart}
              onUpdate={u => updateSubject(s.id, u)}
              onDelete={() => deleteSubject(s.id)} />
          ))}
          {addingSubject ? (
            <div style={{ display:"flex", gap:8, marginTop:10 }}>
              <input autoFocus value={newName} onChange={e=>setNewName(e.target.value)}
                onKeyDown={e=>{if(e.key==="Enter")addSubject();if(e.key==="Escape"){setAddingSubject(false);setNewName("");}}}
                placeholder="Tên môn học..." style={{ flex:1, background:"#fff",
                  border:"1px solid #e5e7eb", borderRadius:10, color:"#111827",
                  fontSize: isMobile?16:14, padding: isMobile?"13px 16px":"10px 14px",
                  outline:"none", boxShadow:"0 1px 4px rgba(0,0,0,.06)" }} />
              <button onClick={addSubject} style={{ background:accent, border:"none",
                borderRadius:10, color:"#fff", fontSize: isMobile?15:13,
                padding: isMobile?"13px 20px":"10px 18px", cursor:"pointer",
                fontWeight:700, flexShrink:0 }}>Thêm</button>
              <button onClick={()=>{setAddingSubject(false);setNewName("");}} style={{
                background:"none", border:"none", color:"#9ca3af",
                fontSize: isMobile?15:13, cursor:"pointer", flexShrink:0 }}>Hủy</button>
            </div>
          ) : (
            <button onClick={()=>setAddingSubject(true)} style={{ display:"flex",
              alignItems:"center", gap:8, width:"100%", background:"none",
              border:`1.5px dashed ${dot}`, borderRadius: isMobile?14:12,
              color:"#9ca3af", fontSize: isMobile?15:13,
              padding: isMobile?"16px 18px":"14px 16px",
              cursor:"pointer", marginTop:6, fontWeight:500,
              minHeight: isMobile?56:"auto" }}>
              {IC.plus} Thêm môn học
            </button>
          )}
        </div>
      ) : activeSection === "lithi" ? (
        /* ── Lịch thi (từ tab Môn học) ── */
        <LichThiInline subjects={subjects||[]} theme={theme} isMobile={isMobile} />
      ) : (
        /* ── Lịch dạy tổng hợp (từ tab Lớp dạy) ── */
        <LichDayInline soanBaiData={soanBaiData||{subjects:[]}} theme={theme} isMobile={isMobile} />
      )}
    </div>
  );
}

/* ── LichThiInline: hiển thị lịch thi từ tab Môn học ── */
function LichThiInline({ subjects, theme, isMobile }) {
  const { accent, accentLight, accentText } = theme;
  const subjectsWithDate = [...subjects]
    .filter(s => s.examDate)
    .sort((a,b) => new Date(a.examDate) - new Date(b.examDate));
  const subjectsNoDate = subjects.filter(s => !s.examDate);

  const getStatus = (examDate) => {
    const d = daysLeft(examDate);
    if (d < 0) return { label: "Đã thi", color: "#9ca3af", bg: "#f3f4f6" };
    if (d === 0) return { label: "Hôm nay!", color: "#dc2626", bg: "#fef2f2" };
    if (d <= 3) return { label: `${d} ngày`, color: "#dc2626", bg: "#fef2f2" };
    if (d <= 7) return { label: `${d} ngày`, color: "#f59e0b", bg: "#fffbeb" };
    return { label: `${d} ngày`, color: "#16a34a", bg: "#f0fdf4" };
  };

  const formatDate = (dateStr) => {
    const d = new Date(dateStr + "T00:00:00");
    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  };

  const totalLessons = subjects.reduce((a,s) => a + (s.lessons?.length||0), 0);
  const doneLessons  = subjects.reduce((a,s) => a + (s.lessons?.filter(l=>l.done).length||0), 0);
  const pct = totalLessons > 0 ? Math.round(doneLessons/totalLessons*100) : 0;

  if (subjects.length === 0) return (
    <div style={{ textAlign:"center", padding:"60px 0", color:"#d1d5db" }}>
      <div style={{ fontSize:46, marginBottom:12 }}>📅</div>
      <div style={{ fontSize: isMobile?15:13 }}>Chưa có môn học nào.<br/>Vào tab <strong>Môn học</strong> để thêm và đặt ngày thi.</div>
    </div>
  );

  return (
    <div>
      {/* Tổng tiến trình */}
      {totalLessons > 0 && (
        <div style={{ background:`linear-gradient(135deg,${accentLight},#fff)`, border:`1px solid ${accent}22`,
          borderRadius:12, padding:"14px 16px", marginBottom:16 }}>
          <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:8 }}>
            <span style={{ fontSize:14, fontWeight:700, color:accentText, textTransform:"uppercase", letterSpacing:".06em" }}>Tiến trình tổng</span>
            <span style={{ fontSize:20, fontWeight:800, color:accentText }}>{pct}%</span>
          </div>
          <div style={{ height:8, background:"#e5e7eb", borderRadius:99, overflow:"hidden" }}>
            <div style={{ height:"100%", width:`${pct}%`, background:`linear-gradient(90deg,${accent},${accentText})`, borderRadius:99, transition:"width .5s ease" }} />
          </div>
          <div style={{ fontSize:13, color:"#9ca3af", marginTop:6 }}>{doneLessons}/{totalLessons} bài hoàn thành</div>
        </div>
      )}

      {subjectsWithDate.length > 0 && (
        <div style={{ marginBottom:16 }}>
          <div style={{ fontSize:12, fontWeight:700, color:"#9ca3af", letterSpacing:".08em", textTransform:"uppercase", marginBottom:10 }}>Đã đặt ngày thi</div>
          {subjectsWithDate.map(s => {
            const status = getStatus(s.examDate);
            const lessons = s.lessons || [];
            const done = lessons.filter(l=>l.done).length;
            const total = lessons.length;
            const spct = total > 0 ? Math.round(done/total*100) : 0;
            const dl = daysLeft(s.examDate);
            const isPast = dl < 0;
            return (
              <div key={s.id} style={{ background:"#fff", border:"1px solid #e5e7eb", borderRadius:12,
                padding:"14px 16px", marginBottom:10, boxShadow:"0 1px 4px rgba(0,0,0,.04)", opacity:isPast?0.6:1 }}>
                <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:8 }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ fontSize:isMobile?14:13, fontWeight:700, color:"#111827", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{s.name}</div>
                    <div style={{ fontSize:13, color:"#9ca3af", marginTop:2 }}>📅 {formatDate(s.examDate)}</div>
                  </div>
                  <span style={{ fontSize:13, fontWeight:700, background:status.bg, color:status.color,
                    borderRadius:20, padding:"3px 10px", marginLeft:10, flexShrink:0, border:`1px solid ${status.color}30` }}>{status.label}</span>
                </div>
                {total > 0 && (
                  <div>
                    <div style={{ display:"flex", justifyContent:"space-between", marginBottom:4 }}>
                      <span style={{ fontSize:13, color:"#9ca3af" }}>{done}/{total} bài</span>
                      <span style={{ fontSize:13, fontWeight:700, color:accentText }}>{spct}%</span>
                    </div>
                    <div style={{ height:5, background:"#f3f4f6", borderRadius:99, overflow:"hidden" }}>
                      <div style={{ height:"100%", width:`${spct}%`, background:isPast?"#d1d5db":`linear-gradient(90deg,${accent},${accentText})`, borderRadius:99 }} />
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {subjectsNoDate.length > 0 && (

/* ─── DonutChart SVG ─── */
function DonutChart({ segments, size }) {
  size = size || 120;
  var r = 42, cx = 60, cy = 60, stroke = 12;
  var circum = 2 * Math.PI * r;
  var offset = 0;
  var total = segments.reduce(function(a, s) { return a + s.value; }, 0);
  if (total === 0) return (
    <svg width={size} height={size} viewBox="0 0 120 120">
      <circle cx={cx} cy={cy} r={r} fill="none" stroke="#f3f4f6" strokeWidth={stroke} />
      <text x={cx} y={cy+5} textAnchor="middle" fontSize="12" fill="#d1d5db" fontFamily="inherit">—</text>
    </svg>
  );
  var arcs = segments.map(function(seg, i) {
    var pct = seg.value / total;
    var dash = pct * circum;
    var gap = circum - dash;
    var el = (
      <circle key={i} cx={cx} cy={cy} r={r} fill="none"
        stroke={seg.color} strokeWidth={stroke}
        strokeDasharray={dash + " " + gap}
        strokeDashoffset={-offset * circum}
        strokeLinecap="butt"
      />
    );
    offset += pct;
    return el;
  });
  return (
    <svg width={size} height={size} viewBox="0 0 120 120" style={{transform:"rotate(-90deg)"}}>
      {arcs}
    </svg>
  );
}

/* ─── MonthBarChart ─── */
function MonthBarChart({ months, accent }) {
  if (!months.length) return null;
  var maxVal = Math.max.apply(null, months.map(function(m){return m.chi;}));
  if (maxVal < 1) maxVal = 1;
  var BAR_W = 32, GAP = 8;
  var chartW = months.length * (BAR_W + GAP);
  return (
    <div style={{ overflowX: "auto", paddingBottom: 4 }}>
      <svg width={Math.max(chartW, 200)} height={80} style={{ display: "block" }}>
        {months.map(function(m, i) {
          var barH = Math.max((m.chi / maxVal) * 54, m.chi > 0 ? 4 : 0);
          var x = i * (BAR_W + GAP);
          return (
            <g key={m.label}>
              <rect x={x} y={60 - barH} width={BAR_W} height={barH} rx={5}
                fill={accent} fillOpacity={0.85} />
              <text x={x + BAR_W / 2} y={75} textAnchor="middle" fontSize="9"
                fill="#9ca3af" fontFamily="inherit">{m.label}</text>
            </g>
          );
        })}
      </svg>
    </div>
  );
}

function LichThiPanel({ subjects, theme, isMobile, onClose }) {

  const subjectsWithDate = [...subjects]
    .filter(s => s.examDate)
    .sort((a,b) => new Date(a.examDate) - new Date(b.examDate));
  const subjectsNoDate = subjects.filter(s => !s.examDate);

  const getStatus = (examDate) => {
    const d = daysLeft(examDate);
    if (d < 0) return { label: "Đã thi", color: "#9ca3af", bg: "#f3f4f6" };
    if (d === 0) return { label: "Hôm nay!", color: "#dc2626", bg: "#fef2f2" };
    if (d <= 3) return { label: `${d} ngày`, color: "#dc2626", bg: "#fef2f2" };
    if (d <= 7) return { label: `${d} ngày`, color: "#f59e0b", bg: "#fffbeb" };
    return { label: `${d} ngày`, color: "#16a34a", bg: "#f0fdf4" };
  };

  const formatDate = (dateStr) => {
    const d = new Date(dateStr + "T00:00:00");
    return `${d.getDate()}/${d.getMonth()+1}/${d.getFullYear()}`;
  };

  const totalLessons = subjects.reduce((a,s) => a + (s.lessons?.length||0), 0);
  const doneLessons = subjects.reduce((a,s) => a + (s.lessons?.filter(l=>l.done).length||0), 0);
  const pct = totalLessons > 0 ? Math.round(doneLessons/totalLessons*100) : 0;

  return (
    <div style={{position:"fixed",inset:0,zIndex:200,display:"flex",flexDirection:"column",background:"rgba(0,0,0,0.45)",animation:"fadeIn .15s ease"}}>
      <div onClick={onClose} style={{flex:1}} />

          <div style={{width:36,height:4,borderRadius:2,background:"#e5e7eb"}} />
        </div>
        {/* Header */}
        <div style={{padding:isMobile?"14px 20px 12px":"16px 28px 14px",display:"flex",alignItems:"center",justifyContent:"space-between",borderBottom:"1px solid #f3f4f6",flexShrink:0}}>
          <div>
            <div style={{fontSize:18,fontWeight:800,color:"#111827",letterSpacing:"-.02em"}}>📅 Lịch thi</div>
            <div style={{fontSize:14,color:"#9ca3af",marginTop:2}}>{subjectsWithDate.length} môn có ngày thi · {subjectsNoDate.length} chưa đặt</div>
          </div>
          <button onClick={onClose} style={{background:"#f3f4f6",border:"none",borderRadius:10,padding:"8px 10px",cursor:"pointer",color:"#6b7280",display:"flex",alignItems:"center"}}>{IC.x}</button>
        </div>

        <div style={{overflowY:"auto",flex:1,padding:isMobile?"16px 20px":"16px 28px",WebkitOverflowScrolling:"touch"}}>

          {/* Tổng tiến trình */}
          {totalLessons > 0 && (
            <div style={{background:`linear-gradient(135deg,${accentLight},#fff)`,border:`1px solid ${accent}22`,borderRadius:12,padding:"14px 16px",marginBottom:16}}>
              <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
                <span style={{fontSize:14,fontWeight:700,color:accentText,textTransform:"uppercase",letterSpacing:".06em"}}>Tiến trình tổng</span>
                <span style={{fontSize:20,fontWeight:800,color:accentText}}>{pct}%</span>
              </div>
              <div style={{height:8,background:"#e5e7eb",borderRadius:99,overflow:"hidden"}}>

                const lessons = s.lessons || [];
                const done = lessons.filter(l=>l.done).length;
                const total = lessons.length;
                const spct = total > 0 ? Math.round(done/total*100) : 0;

              <div style={{fontSize:12,fontWeight:700,color:"#d1d5db",letterSpacing:".08em",textTransform:"uppercase",marginBottom:8}}>Chưa đặt ngày thi</div>

                const lessons = s.lessons || [];
                const done = lessons.filter(l=>l.done).length;
                const total = lessons.length;
                const spct = total > 0 ? Math.round(done/total*100) : 0;
                return (
                  <div key={s.id} style={{background:"#fafafa",border:"1px solid #f3f4f6",borderRadius:10,padding:"12px 14px",marginBottom:8,display:"flex",alignItems:"center",justifyContent:"space-between",gap:10}}>

                  </div>
                );
              })}
            </div>
          )}

          {subjects.length === 0 && (
            <div style={{textAlign:"center",padding:"40px 0",color:"#d1d5db"}}>
              <div style={{fontSize:38,marginBottom:10}}>📅</div>
              <div style={{fontSize:15}}>Chưa có môn học nào</div>
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }
  static getDerivedStateFromError(e) { return { error: e }; }
  componentDidCatch(e, info) { 
    console.error("App crash:", e, info); 
    console.error("Component stack:", info?.componentStack);
    console.error("Error stack:", e?.stack);
  }
  render() {
    if (this.state.error) {
      return (
        <div style={{padding:32,textAlign:"center",fontFamily:"sans-serif"}}>
          <div style={{fontSize:34,marginBottom:12}}>⚠️</div>
          <div style={{fontSize:18,fontWeight:700,color:"#dc2626",marginBottom:8}}>Ứng dụng gặp lỗi</div>
          <div style={{fontSize:14,color:"#6b7280",marginBottom:16,maxWidth:300,margin:"0 auto 16px"}}>
            {String(this.state.error)}
          </div>
          <button onClick={()=>window.location.reload()} style={{background:"#5c6bc0",color:"#fff",border:"none",borderRadius:8,padding:"10px 20px",cursor:"pointer",fontWeight:700}}>
            Tải lại trang
          </button>
        </div>
      );
    }
    return this.props.children;
  }
}

  const setTodos = (updater) => {

      return next;
    });
  };

    setLichHocDataState(prev => {

      saveLichHoc(next);
      return next;
    });
  };
  const setTaiChinh = (updater) => {
    setTaiChinhState(prev => {
      const next = typeof updater === 'function' ? updater(prev) : updater;
      saveTaiChinh(next);
      return next;
    });
  };
  const [addingSubject, setAddingSubject] = useState(false);
  const [newSubjectName, setNewSubjectName] = useState("");

  const theme = THEMES[themeKey]||THEMES.indigo;
  const { fbReady, syncing, syncOk, pushToFirebase, isRemoteUpdate } = useFirebaseSync();
  const isFirstLoad = useRef(true);

  // Lắng nghe realtime từ Firebase
  // Signal splash to hide
  useEffect(() => { if (window._appReady) window._appReady(); }, []);

  useEffect(() => {
    if (!fbReady || !window._onSnapshot || !window._fbDoc) return;
    try {
    const unsub = window._onSnapshot(window._fbDoc("studytodo"), (snap) => {
      if (!snap.exists()) {
        // Tài liệu chưa tồn tại → push dữ liệu local lên lần đầu
        isFirstLoad.current = false;
        return;
      }
      const d = snap.data();
      // Bật cờ để pushToFirebase bỏ qua, tránh vòng lặp
      isRemoteUpdate.current = true;
      if (d.monhoc) { try { const v = JSON.parse(d.monhoc); const safe = { subjects: Array.isArray(v?.subjects) ? v.subjects : [] }; setData(safe); saveData(safe); } catch {} }
      if (d.lichhoc) { try { const v = JSON.parse(d.lichhoc); setSchedule(v || {}); saveSchedule(v || {}); } catch {} }
      if (d.soanbai) { try { const v = JSON.parse(d.soanbai); const safe = { subjects: Array.isArray(v?.subjects) ? v.subjects : [] }; setSoanBaiData(safe); saveSoanBai(safe); } catch {} }
      if (d.taichinh) { try { const v = JSON.parse(d.taichinh); const safe = { dichLam: v?.dichLam||0, chiCungXang: v?.chiCungXang||0, chiCungTietKiem: v?.chiCungTietKiem||0, chiTieuHangNgay: Array.isArray(v?.chiTieuHangNgay)?v.chiTieuHangNgay:[], chiCungList: Array.isArray(v?.chiCungList)?v.chiCungList:[], thuNhapList: Array.isArray(v?.thuNhapList)?v.thuNhapList:[] }; setTaiChinhState(safe); saveTaiChinh(safe); } catch {} }
      if (d.thoikhoa) { try { const v = JSON.parse(d.thoikhoa); const safe = { subjects: Array.isArray(v?.subjects)?v.subjects:[], semesterStart: v?.semesterStart||"" }; setLichHocDataState(safe); saveLichHoc(safe); } catch {} }
      // Tắt cờ sau khi React xử lý xong state (nextTick)
      setTimeout(() => { isRemoteUpdate.current = false; isFirstLoad.current = false; }, 0);
    });
    return () => unsub();
    } catch(e) { console.error("Snapshot error:", e); }
  }, [fbReady]);

  // Ghi lên Firebase + localStorage khi data thay đổi (bỏ qua lần mount đầu tiên)
  const isMounted = useRef(false);
  useEffect(() => {
    if (!isMounted.current) { isMounted.current = true; return; }
    saveData(data); pushToFirebase("monhoc", data);
  }, [data]);
  useEffect(() => { if (!isMounted.current) return; saveSchedule(schedule); pushToFirebase("lichhoc", schedule); }, [schedule]);
  useEffect(() => { if (!isMounted.current) return; saveSoanBai(soanBaiData); pushToFirebase("soanbai", soanBaiData); }, [soanBaiData]);
  useEffect(() => { if (!isMounted.current) return; saveTaiChinh(taiChinh); pushToFirebase("taichinh", taiChinh); }, [taiChinh]);
  useEffect(() => { if (!isMounted.current) return; saveLichHoc(lichHocData); pushToFirebase("thoikhoa", lichHocData); }, [lichHocData]);
  useEffect(() => { localStorage.setItem("studytodo_theme",themeKey); }, [themeKey]);

  // Đổi sang thiết bị khác bằng mã ID
  const switchToId = () => {
    const id = importId.trim();

          <div style={{display:"flex",alignItems:"center",gap:isMobile?10:8}}>
            {/* Sync status */}
            <button onClick={()=>setShowSyncId(v=>!v)} title="Đồng bộ thiết bị" style={{background:syncOk?"#f0fdf4":fbReady?"#fffbeb":"#f9fafb",border:`1px solid ${syncOk?"#bbf7d0":fbReady?"#fde68a":"#e5e7eb"}`,borderRadius:8,padding:isMobile?"7px 10px":"5px 8px",cursor:"pointer",display:"flex",alignItems:"center",gap:5,fontSize:isMobile?12:11,color:syncOk?"#15803d":fbReady?"#92400e":"#9ca3af",fontWeight:700}}>
              {syncing ? <span style={{display:"inline-block",width:10,height:10,border:"2px solid currentColor",borderTopColor:"transparent",borderRadius:"50%",animation:"spin 0.7s linear infinite"}} /> : <span>{syncOk?"☁️✓":fbReady?"☁️":"○"}</span>}
              {!isMobile && (syncOk?"Đã lưu":fbReady?"Đang kết nối...":"Offline")}
            </button>
          </div>
        </div>
        {/* Sync ID panel */}
        {showSyncId && (
          <div style={{maxWidth:isMobile?"100%":720,margin:"0 auto",padding:isMobile?"0 16px 14px":"0 28px 14px",borderTop:"1px solid #f3f4f6"}}>
            <div style={{fontSize:13,color:"#9ca3af",fontWeight:600,marginBottom:6,marginTop:10}}>MÃ THIẾT BỊ CỦA BẠN</div>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:10}}>
              <code style={{flex:1,background:"#f3f4f6",borderRadius:8,padding:"8px 12px",fontSize:15,color:"#374151",letterSpacing:".05em",wordBreak:"break-all"}}>{syncId}</code>
              <button onClick={()=>{navigator.clipboard.writeText(syncId);}} style={{background:theme.accent,border:"none",borderRadius:8,color:"#fff",fontSize:14,padding:"8px 14px",cursor:"pointer",fontWeight:700,flexShrink:0}}>Sao chép</button>
            </div>
            <div style={{fontSize:13,color:"#9ca3af",marginBottom:6,fontWeight:600}}>ĐỒNG BỘ THIẾT BỊ KHÁC — nhập mã từ thiết bị kia</div>
            <div style={{display:"flex",gap:8}}>
              <input value={importId} onChange={e=>setImportId(e.target.value)} placeholder="Dán mã thiết bị vào đây..." style={{flex:1,background:"#fff",border:"1px solid #e5e7eb",borderRadius:8,fontSize:15,padding:"8px 12px",outline:"none",color:"#374151"}} />
              <button onClick={switchToId} style={{background:theme.accent,border:"none",borderRadius:8,color:"#fff",fontSize:14,padding:"8px 14px",cursor:"pointer",fontWeight:700,flexShrink:0}}>Đồng bộ</button>
            </div>
            <p style={{fontSize:13,color:"#d1d5db",marginTop:8}}>💡 Sao chép mã thiết bị này → dán vào thiết bị khác để dùng chung dữ liệu</p>
          </div>
        )}
      </div>

      <NavBar activeTab={activeTab} onTabChange={setActiveTab} theme={theme} isMobile={isMobile} />

      {activeTab==="monhoc"?(
        <div style={{maxWidth:isMobile?"100%":720,margin:"0 auto",padding:isMobile?`20px 16px ${bottomPad}`:"32px 28px 80px"}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:isMobile?18:24}}>
            <div>{data.subjects.length>0&&<p style={{margin:0,fontSize:isMobile?13:12,color:"#9ca3af",fontWeight:500}}>{data.subjects.length} môn · {data.subjects.reduce((a,s)=>a+(s.lessons?.filter(l=>l.done).length||0),0)}/{data.subjects.reduce((a,s)=>a+(s.lessons?.length||0),0)} bài hoàn thành</p>}</div>
            <div style={{display:"flex",alignItems:"center",gap:8}}>
              {/* Nút lịch thi dấu ! */}
              <button onClick={()=>setShowLichThi(true)} title="Lịch thi" style={{position:"relative",width:isMobile?36:30,height:isMobile?36:30,borderRadius:"50%",background:"#fff",border:"2px solid #f59e0b",display:"flex",alignItems:"center",justifyContent:"center",cursor:"pointer",flexShrink:0,boxShadow:"0 1px 4px rgba(245,158,11,.25)"}}>
                <span style={{fontSize:isMobile?16:14,fontWeight:900,color:"#f59e0b",lineHeight:1}}>!</span>
                {data.subjects.some(s=>s.examDate&&daysLeft(s.examDate)>=0&&daysLeft(s.examDate)<=7)&&(
                  <span style={{position:"absolute",top:-3,right:-3,width:8,height:8,borderRadius:"50%",background:"#dc2626",border:"1.5px solid #fff"}} />
                )}
              </button>
              <button onClick={()=>setShowImportLichThi(true)} title="Import lịch thi" style={{display:"flex",alignItems:"center",gap:5,background:"#fff7ed",border:"1px solid #fed7aa",borderRadius:8,color:"#c2410c",fontSize:isMobile?12:11,padding:isMobile?"8px 12px":"5px 10px",cursor:"pointer",fontWeight:700,minHeight:isMobile?40:"auto"}}>
                <svg width="13" height="13" fill="none" stroke="currentColor" strokeWidth="2.2" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Import thi
              </button>
              <button onClick={()=>setShowDashboard(v=>!v)} style={{display:"flex",alignItems:"center",gap:5,background:showDashboard?theme.accentLight:"none",border:`1px solid ${showDashboard?theme.accent+"50":"#e5e7eb"}`,borderRadius:8,color:showDashboard?theme.accentText:"#9ca3af",fontSize:isMobile?12:11,padding:isMobile?"8px 12px":"5px 10px",cursor:"pointer",fontWeight:700,minHeight:isMobile?40:"auto"}}>
                {IC.chart} Tổng quan
              </button>
            </div>
          </div>
          {showLichThi&&<LichThiPanel subjects={data.subjects} theme={theme} isMobile={isMobile} onClose={()=>setShowLichThi(false)} />}
          {showImportLichThi&&<ImportLichThiModal theme={theme} isMobile={isMobile} onClose={()=>setShowImportLichThi(false)} onImport={newSubjects=>{
            setData(d=>{
              const existing = d.subjects.map(s=>s.name.toLowerCase().trim());
              const toAdd = newSubjects.filter(ns=>!existing.includes(ns.name.toLowerCase().trim()));
              const toUpdate = d.subjects.map(s=>{
                const match = newSubjects.find(ns=>ns.name.toLowerCase().trim()===s.name.toLowerCase().trim());
                return match ? {...s, examDate:match.examDate, examTime:match.examTime, examRoom:match.examRoom} : s;
              });
              return {...d, subjects:[...toUpdate, ...toAdd.map(ns=>({id:uid(),name:ns.name,examDate:ns.examDate,examTime:ns.examTime,examRoom:ns.examRoom,lessons:[]}))]};
            });
            setShowImportLichThi(false);
          }} />}
          {showDashboard&&data.subjects.length>0&&<Dashboard subjects={data.subjects} theme={theme} isMobile={isMobile} />}
          {sorted.map(s=><SubjectCard key={s.id} subject={s} theme={theme} isMobile={isMobile} onUpdate={u=>updateSubject(s.id,u)} onDelete={()=>deleteSubject(s.id)} />)}
          {data.subjects.length===0&&!addingSubject&&(
            <div style={{textAlign:"center",padding:"70px 0",color:"#d1d5db"}}>
              <div style={{fontSize:46,marginBottom:14}}>◎</div>
              <div style={{fontSize:isMobile?15:13,fontWeight:500}}>Chưa có môn học nào</div>
            </div>
          )}
          {addingSubject?(
            <div style={{display:"flex",gap:8,marginTop:10}}>
              <input autoFocus value={newSubjectName} onChange={e=>setNewSubjectName(e.target.value)} onKeyDown={e=>{if(e.key==="Enter")addSubject();if(e.key==="Escape"){setAddingSubject(false);setNewSubjectName("");}}} placeholder="Tên môn học..." style={{flex:1,background:"#fff",border:"1px solid #e5e7eb",borderRadius:10,color:"#111827",fontSize:isMobile?16:14,padding:isMobile?"13px 16px":"10px 14px",outline:"none",boxShadow:"0 1px 4px rgba(0,0,0,.06)"}} />
              <button onClick={addSubject} style={{background:theme.accent,border:"none",borderRadius:10,color:"#fff",fontSize:isMobile?15:13,padding:isMobile?"13px 20px":"10px 18px",cursor:"pointer",fontWeight:700,flexShrink:0}}>Thêm</button>
              <button onClick={()=>{setAddingSubject(false);setNewSubjectName("");}} style={{background:"none",border:"none",color:"#9ca3af",fontSize:isMobile?15:13,cursor:"pointer",flexShrink:0}}>Hủy</button>
            </div>
          ):(
            <button onClick={()=>setAddingSubject(true)} style={{display:"flex",alignItems:"center",gap:8,width:"100%",background:"none",border:`1.5px dashed ${theme.dot}`,borderRadius:isMobile?14:12,color:"#9ca3af",fontSize:isMobile?15:13,padding:isMobile?"16px 18px":"14px 16px",cursor:"pointer",marginTop:6,fontWeight:500,minHeight:isMobile?56:"auto"}}>
              {IC.plus} Thêm môn học
            </button>
          )}

        </div>
      ) : activeTab==="homnay" ? (
        <HomNayPage theme={theme} isMobile={isMobile} lichHocData={lichHocData} examSubjects={data.subjects} soanBaiData={soanBaiData} todos={todos} setTodos={setTodos} />
      ) : activeTab==="lichhoc" ? (
        <CalendarPage theme={theme} isMobile={isMobile} schedule={schedule} onScheduleChange={setSchedule} subjects={data.subjects} soanBaiData={soanBaiData} lichHocData={lichHocData} onLichHocChange={setLichHocData} todos={todos} setTodos={setTodos} />
      ) : activeTab==="soanbai" ? (
        <SoanBaiPage theme={theme} isMobile={isMobile} soanBaiData={soanBaiData} setSoanBaiData={setSoanBaiData} />
      ) : activeTab==="taichinh" ? (
        <TaiChinhPage theme={theme} isMobile={isMobile} taiChinh={taiChinh} setTaiChinh={setTaiChinh} soanBaiData={soanBaiData} />
      ) : activeTab==="todo" ? (
        <TodoPage theme={theme} isMobile={isMobile} todos={todos} setTodos={setTodos} />
      ) : (
        <PlaceholderPage tab={currentTabInfo} theme={theme} isMobile={isMobile} />
      )}
      <div style={{textAlign:"center",padding:isMobile?"12px 0 calc(20px + env(safe-area-inset-bottom))":"16px 0 32px",fontSize:13,color:"#d1d5db",fontWeight:500,letterSpacing:".06em"}}>
        made by <span style={{fontWeight:700,color:"#9ca3af"}}>canhan</span>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("app")).render(<ErrorBoundary><App /></ErrorBoundary>);
</script>

</body>
</html>

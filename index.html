<style>
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Plus Jakarta Sans',sans-serif;background:#f8fafc;color:#111827;min-height:100vh;}
  button,input,textarea,label,a{touch-action:manipulation;font-family:inherit;}
  ::-webkit-scrollbar{width:4px;}
  ::-webkit-scrollbar-thumb{background:#e5e7eb;border-radius:2px;}
  input[type=date]::-webkit-calendar-picker-indicator{opacity:0.4;cursor:pointer;}
  @media(max-width:500px){input,textarea,select{font-size:18.0px!important;}}
  @keyframes spin{to{transform:rotate(360deg);}}
  @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  @keyframes slideInLeft{from{transform:translateX(32px);opacity:0}to{transform:translateX(0);opacity:1}}
  @keyframes slideInRight{from{transform:translateX(-32px);opacity:0}to{transform:translateX(0);opacity:1}}
  .tab-slide-left{animation:slideInLeft .22s cubic-bezier(.4,0,.2,1) both;}
  .tab-slide-right{animation:slideInRight .22s cubic-bezier(.4,0,.2,1) both;}
  #app{min-height:100vh;}

  /* ── Splash screen ── */
  #splash{
    position:fixed;inset:0;z-index:9999;
    background:#000;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;
    transition:opacity .4s ease, visibility .4s ease;
  }
  #splash.hide{opacity:0;visibility:hidden;}
  @keyframes splashPulse{
    0%,100%{transform:scale(1);opacity:1}
    50%{transform:scale(1.08);opacity:.7}
  }
  @keyframes splashBar{
    0%{width:0%}
    60%{width:75%}
    100%{width:100%}
  }
  .splash-wrap{position:relative;width:160px;height:160px;display:flex;align-items:center;justify-content:center;}
  .splash-ring{position:absolute;inset:0;transform:rotate(-90deg);}
  .splash-ring circle.track{stroke:#333;}
  @keyframes splashRing{0%{stroke-dashoffset:471;}100%{stroke-dashoffset:0;}}
  .splash-ring circle.fill{stroke:url(#ringGrad);stroke-dasharray:471;stroke-dashoffset:471;animation:splashRing 1.3s cubic-bezier(.4,0,.2,1) forwards;}
  .splash-logo-img{width:88px;height:88px;object-fit:contain;animation:splashPulse 1.6s ease-in-out infinite;}
  .splash-title-top{font-size:12.0px;letter-spacing:.18em;color:#888;text-transform:uppercase;font-weight:700;margin-top:14px;}
  .splash-title{font-size:28.0px;font-weight:800;letter-spacing:-.03em;color:#fff;line-height:1.15;}
  @keyframes fadeSlideDown {
    from { opacity: 0; transform: translateY(-6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

<script>
  // Ẩn splash khi React đã mount xong (hoặc tối đa 6s)
  var splashHidden = false;
  function hideSplash() {
    if (splashHidden) return;
    splashHidden = true;
    var s = document.getElementById("splash");
    if (s) {
      s.classList.add("hide");
      setTimeout(function(){ s.style.display="none"; }, 420);
    }
  }
  // Ẩn splash khi firebase-ready hoặc auth-state fire
  window.addEventListener("firebase-ready", hideSplash);
  window.addEventListener("auth-state", hideSplash);
  // Fallback cứng: tối đa 10 giây (phòng edge case Firebase không fire)
  window.addEventListener("load", function() { setTimeout(hideSplash, 10000); });
  // Expose ra window để module script có thể gọi
  window._hideSplash = hideSplash;
  // Signal from React khi app đã mount
  window._appReady = function() { hideSplash(); };
</script>

<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  import {
    getAuth, onAuthStateChanged,
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    signOut,
    GoogleAuthProvider,
    signInWithPopup,
    updatePassword,
    EmailAuthProvider,
    reauthenticateWithCredential,
    sendPasswordResetEmail
  } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDVdPhYUoC3S3yorWTnu1gE_RZIFXoXK_4",
    authDomain: "tracker-d4d19.firebaseapp.com",
    projectId: "tracker-d4d19",
    storageBucket: "tracker-d4d19.firebasestorage.app",
    messagingSenderId: "406094209475",
    appId: "1:406094209475:web:aed4809cd6588cf2b85d76",
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  // Expose Firestore helpers
  window._db = db;
  window._fbDoc = (col, uid) => doc(db, col, uid || window._currentUid || "default");
  window._onSnapshot = onSnapshot;
  window._setDoc = setDoc;

  // Expose auth actions cho React
  window._auth = auth;
  window._signIn = (email, password) => signInWithEmailAndPassword(auth, email, password);
  window._signUp = (email, password) => createUserWithEmailAndPassword(auth, email, password);
  window._signOut = () => signOut(auth);

  // ── Tài khoản local (không cần mạng) ──
  const LOCAL_ACCOUNTS = {
    "admin@test": { password: "admin", uid: "local_admin_uid", email: "admin@test" }
  };
  window._signInLocal = function(email, password) {
    const acc = LOCAL_ACCOUNTS[email];
    if (acc && acc.password === password) {
      window._currentUid = acc.uid;
      window._userEmail  = acc.email;
      window._fbReady    = false; // local mode — không dùng Firestore
      window.dispatchEvent(new CustomEvent("auth-state",    { detail: { uid: acc.uid, email: acc.email } }));
      window.dispatchEvent(new CustomEvent("firebase-ready",{ detail: { uid: acc.uid } }));
      return true;
    }
    return false;
  };
  window._signOutLocal = function() {
    window._currentUid = null;
    window._userEmail  = null;
    window.dispatchEvent(new CustomEvent("auth-state", { detail: { uid: null } }));
  };
  window._signInGoogle = () => signInWithPopup(auth, new GoogleAuthProvider());
  window._changePassword = async (currentPassword, newPassword) => {
    const user = auth.currentUser;
    if (!user) throw new Error("Chưa đăng nhập.");
    // Google users don't have a password — skip reauth
    const isGoogle = user.providerData.some(p => p.providerId === "google.com");
    if (!isGoogle) {
      const cred = EmailAuthProvider.credential(user.email, currentPassword);
      await reauthenticateWithCredential(user, cred);
    }
    await updatePassword(user, newPassword);
  };
  window._resetPassword = (email) => sendPasswordResetEmail(auth, email);
  window._isGoogleUser = () => {
    const user = auth.currentUser;
    return user ? user.providerData.some(p => p.providerId === "google.com") : false;
  };

  // Lắng nghe trạng thái đăng nhập
  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // Chưa đăng nhập → hiện màn hình login
      window._currentUid = null;
      window._fbReady = false;
      window.dispatchEvent(new CustomEvent("auth-state", { detail: { uid: null } }));
      window._hideSplash && window._hideSplash(); // ẩn splash để hiện login
      return;
    }

    window._currentUid = user.uid;
    window._userEmail = user.email;

    // ── Migration một lần: copy dữ liệu từ syncId cũ (anonymous) sang UID mới ──
    const oldId = localStorage.getItem("studytodo_uid");
    if (oldId && oldId !== user.uid) {
      try {
        const { getDoc } = await import("https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js");
        const newDocRef = doc(db, "studytodo", user.uid);
        const oldDocRef = doc(db, "studytodo", oldId);
        const [newSnap, oldSnap] = await Promise.all([getDoc(newDocRef), getDoc(oldDocRef)]);
        if (!newSnap.exists() && oldSnap.exists()) {
          await setDoc(newDocRef, oldSnap.data());
          console.log("Migration hoan tat.");
        }
      } catch (e) {
        console.warn("Migration failed:", e);
      }
    }

// Tính số tuần của ngày d tính từ semesterStart (tuần 1 = tuần chứa ngày đầu HK)
function getWeekNumber(dateStr, semesterStart) {
  if (!semesterStart) return null;
  const d = new Date(dateStr + "T00:00:00");
  const s = new Date(semesterStart + "T00:00:00");
  // Lùi về đầu tuần (Thứ 2) của semesterStart
  const dow = s.getDay(); // 0=CN
  const startMonday = new Date(s);
  startMonday.setDate(s.getDate() - (dow === 0 ? 6 : dow - 1));
  const diff = Math.floor((d - startMonday) / (7 * 86400000));

}
